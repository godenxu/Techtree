<script>
/* ==== assets/validator.js ==== */
/* ==========================================================================
 * 金融科技树 · 浏览器内数据校验
 * 页面加载时自动运行；发现问题在顶栏显示角标，点开可看到具体节点 ID。
 * 与 tools/validate.mjs 的规则保持一致。
 * ========================================================================== */
var TT = (globalThis.TT = globalThis.TT || {});

TT.validate = function () {
  const tx = TT.taxonomy, nodes = TT.nodes || [], awards = TT.awards || [], orgs = TT.orgs || [];
  const errors = [], warns = [];
  const E = m => errors.push(m), W = m => warns.push(m);

  const eraIdx = Object.fromEntries(tx.eras.map((e, i) => [e.id, i]));
  const capIds = new Set(tx.capabilities.map(c => c.id));
  const domIds = new Set(tx.domains.map(d => d.id));
  const archIds = new Set(tx.arch.map(a => a.id));
  const tagIds = new Set(tx.tags.map(t => t.id));
  const statusIds = new Set(tx.status.map(s => s.id));
  const enums = {
    maturity: new Set(tx.maturity.map(m => m.id)),
    adoption: new Set(tx.adoption.map(a => a.id)),
    confidence: new Set(tx.confidence.map(c => c.id)),
    autonomy: new Set(tx.autonomy.map(a => a.id))
  };

  tx.capabilities.forEach(c => { if (!domIds.has(c.domain)) E(`能力 ${c.id} 指向不存在的领域 ${c.domain}`); });
  tx.domains.forEach(d => { if (!archIds.has(d.arch)) E(`领域 ${d.id} 指向不存在的架构线 ${d.arch}`); });

  const byId = new Map();
  nodes.forEach(n => {
    if (byId.has(n.id)) E(`节点 ID 重复：${n.id}`);
    byId.set(n.id, n);
    if (!capIds.has(n.cap)) E(`${n.id} 归属的能力 ${n.cap} 不存在`);
    if (!(n.era in eraIdx)) E(`${n.id} 的时代 ${n.era} 不合法`);
    for (const k of ['maturity', 'adoption', 'confidence', 'autonomy'])
      if (n[k] && !enums[k].has(n[k])) E(`${n.id} 的 ${k}="${n[k]}" 不是合法取值`);
    (n.tags || []).forEach(t => { if (!tagIds.has(t)) E(`${n.id} 含未定义的标签 ${t}`); });
    if (!n.name || !n.desc) E(`${n.id} 缺少 name 或 desc`);
  });

  nodes.forEach(n => (n.deps || []).forEach(d => {
    const dep = byId.get(d);
    if (!dep) return E(`${n.id} 依赖了不存在的节点 ${d}`);
    if (d === n.id) return E(`${n.id} 依赖了自己`);
    const gap = eraIdx[n.era] - eraIdx[dep.era];
    if (gap < 0) E(`时代倒挂：${n.id}(${n.era}) 依赖了更晚的 ${d}(${dep.era})`);
    else if (gap >= 3) W(`跨代较远：${n.id} 依赖 ${d}，相隔 ${gap} 个时代`);
  }));

  const color = new Map(), stack = [];
  (function () {
    function dfs(id) {
      if (color.get(id) === 2) return;
      if (color.get(id) === 1) {
        const at = stack.indexOf(id);
        return E(`存在循环依赖：${stack.slice(at).concat(id).join(' → ')}`);
      }
      color.set(id, 1); stack.push(id);
      (byId.get(id)?.deps || []).forEach(d => { if (byId.has(d)) dfs(d); });
      stack.pop(); color.set(id, 2);
    }
    nodes.forEach(n => dfs(n.id));
  })();

  /* 除了每条线真正的起点，其他节点都应该有前置 —— 没有前置说明依赖漏填了 */
  const roots = nodes.filter(n => !(n.deps || []).length);
  roots.forEach(r => {
    if (eraIdx[r.era] > 0) E(`${r.id} ${r.name}（${r.era}）没有任何前置，只有第 Ⅰ 时代的起点技术才允许无前置`);
  });
  if (roots.length > 1) W(`根节点有 ${roots.length} 个：${roots.map(r => r.id + ' ' + r.name).join('、')}，确认是否都是真正的起点`);
  /* 生命周期字段自洽性 */
  nodes.forEach(n => {
    if (n.lifecycle && !['active', 'legacy', 'sunset'].includes(n.lifecycle))
      E(`${n.id} 的 lifecycle="${n.lifecycle}" 不合法`);
    (n.supersededBy || []).forEach(x => {
      if (!byId.has(x)) E(`${n.id} 的 supersededBy 指向不存在的节点 ${x}`);
      else if (eraIdx[byId.get(x).era] < eraIdx[n.era]) W(`${n.id} 被更早时代的 ${x} 替代，确认是否写反`);
    });
    if (n.lifecycle && n.lifecycle !== 'active' && !(n.supersededBy || []).length)
      W(`${n.id} 标记为${n.lifecycle === 'sunset' ? '退役中' : '存量维持'}但没写替代方向 supersededBy`);
  });

  tx.capabilities.forEach(c => {
    if (!nodes.some(n => n.cap === c.id)) W(`能力 ${c.id} ${c.name} 下没有任何技术节点`);
  });
  awards.forEach((a, i) => (a.mappedNodes || []).forEach(mn => {
    if (!byId.has(mn)) E(`奖项「${a.project || '#' + (i + 1)}」映射到不存在的节点 ${mn}`);
  }));
  orgs.forEach(o => Object.entries(o.overrides || {}).forEach(([id, ov]) => {
    if (!byId.has(id)) E(`单位「${o.orgName}」覆盖了不存在的节点 ${id}`);
    if (ov.status && !statusIds.has(ov.status)) E(`单位「${o.orgName}」的 ${id} 状态 "${ov.status}" 不合法`);
  }));

  return { errors, warns };
};

</script>
<script>
/* ==== assets/model.js ==== */
/* ==========================================================================
 * 金融科技树 · 模型层
 * 负责：索引、层级归并、依赖图运算、单位档案叠加、进度汇总、路线图排程。
 * 关键约定：依赖关系只在 L2 技术层定义一次；
 *          L1 能力层与 L0 领域层的连线与进度全部由此文件自动推导。
 * ========================================================================== */
var TT = (globalThis.TT = globalThis.TT || {});

TT.model = (function () {
  const tx = TT.taxonomy;

  /* ---------------- 基础索引 ---------------- */
  const capById = new Map(tx.capabilities.map(c => [c.id, c]));
  const domById = new Map(tx.domains.map(d => [d.id, d]));
  const archById = new Map(tx.arch.map(a => [a.id, a]));
  const eraIdx = new Map(tx.eras.map((e, i) => [e.id, i]));
  const statusById = new Map(tx.status.map(s => [s.id, s]));
  const maturityById = new Map(tx.maturity.map(m => [m.id, m]));
  const adoptionById = new Map(tx.adoption.map(a => [a.id, a]));
  const autonomyById = new Map(tx.autonomy.map(a => [a.id, a]));
  const tagById = new Map(tx.tags.map(t => [t.id, t]));

  const archOfCap = capId => domById.get(capById.get(capId)?.domain)?.arch;
  const domainOfCap = capId => capById.get(capId)?.domain;

  /* ---------------- 奖项索引 ---------------- */
  const awardsByNode = new Map();
  (TT.awards || []).forEach(a => (a.mappedNodes || []).forEach(id => {
    if (!awardsByNode.has(id)) awardsByNode.set(id, []);
    awardsByNode.get(id).push(a);
  }));

  /* ---------------- 单位档案 ---------------- */
  function orgList() {
    const list = [{ orgId: 'benchmark', orgName: '世界金融科技基准', orgType: '行业整体', readonly: true }];
    (TT.orgs || []).forEach(o => list.push(o));
    return list;
  }
  const orgById = id => orgList().find(o => o.orgId === id);

  /* 叠加单位档案，产出本次渲染使用的技术节点全集 */
  function resolve(orgId) {
    const org = orgById(orgId);
    const base = TT.nodes.concat((org && org.customNodes) || []);
    const ov = (org && org.overrides) || {};
    return base.map(n => {
      const o = ov[n.id] || {};
      return Object.assign({}, n, o, {
        _status: orgId === 'benchmark' ? null : (o.status || 'unknown'),
        _arch: archOfCap(n.cap),
        _domain: domainOfCap(n.cap),
        _awards: awardsByNode.get(n.id) || [],
        _custom: !!n.custom || !!(org && (org.customNodes || []).some(c => c.id === n.id))
      });
    });
  }

  /* ---------------- 层级：L2 → L1 → L0 ---------------- */
  function hierarchy(nodes) {
    const techByCap = new Map(), capsByDom = new Map();
    nodes.forEach(n => {
      if (!techByCap.has(n.cap)) techByCap.set(n.cap, []);
      techByCap.get(n.cap).push(n);
    });
    tx.capabilities.forEach(c => {
      if (!capsByDom.has(c.domain)) capsByDom.set(c.domain, []);
      capsByDom.get(c.domain).push(c);
    });
    return { techByCap, capsByDom };
  }

  /* 某个聚合单元覆盖的技术节点。
   * 聚合单元的 ID 形如 `D06@E4`（领域 × 时代）或 `C601@E4`（能力 × 时代）——
   * 一个领域横跨多个时代，硬压成一个格子会让早期和末期的时代整列消失，
   * 讲演进路径时直接断代。所以聚合层按「主体 × 时代」切分。 */
  function splitUnitId(id) {
    const at = String(id).indexOf('@');
    return at < 0 ? { base: id, era: null } : { base: id.slice(0, at), era: id.slice(at + 1) };
  }

  function descendants(id, nodes, h) {
    const { base, era } = splitUnitId(id);
    let list;
    if (capById.has(base)) list = h.techByCap.get(base) || [];
    else if (domById.has(base)) list = (h.capsByDom.get(base) || []).flatMap(c => h.techByCap.get(c.id) || []);
    else return nodes.filter(n => n.id === base);
    return era ? list.filter(t => t.era === era) : list;
  }

  /* 某个主体（领域 / 能力）在哪些时代里有技术节点，按时代先后返回 */
  function erasOf(baseId, nodes, h) {
    const set = new Set(descendants(baseId, nodes, h).map(t => t.era));
    return tx.eras.filter(e => set.has(e.id)).map(e => e.id);
  }

  /* 聚合格的显示名：优先用手工策划的里程碑名；能力层没有手工命名的，
   * 自动取该格里最有代表性的技术 —— 业务价值高、下游依赖多的那个。
   * 之所以不直接用领域名，是因为一个领域会在多个时代各出现一格，
   * 都叫领域名就变成「同一个名字重复五遍」。 */
  let _downstream = null;
  function milestoneOf(unitId, nodes, h) {
    const curated = tx.milestones && tx.milestones[unitId];
    if (curated) return curated;
    const list = descendants(unitId, nodes, h);
    if (!list.length) return '';
    if (!_downstream) {
      _downstream = new Map();
      nodes.forEach(n => (n.deps || []).forEach(d => _downstream.set(d, (_downstream.get(d) || 0) + 1)));
    }
    const score = t => (t.value || 0) * 3 + (_downstream.get(t.id) || 0);
    return [...list].sort((a, b) => score(b) - score(a))[0].name;
  }

  /* ---------------- 可见单元集：三档全局粒度 + 单点混合展开 ----------------
   * expanded 是一个 Set，含被展开的领域 / 能力 ID（不带 @时代 后缀）。 */
  function visibleUnits(nodes, expanded, h) {
    const out = [];
    tx.domains.forEach(d => {
      if (!expanded.has(d.id)) {
        erasOf(d.id, nodes, h).forEach(era =>
          out.push({ kind: 'domain', id: d.id + '@' + era, base: d.id, era, ref: d }));
        return;
      }
      (h.capsByDom.get(d.id) || []).forEach(c => {
        if (!expanded.has(c.id)) {
          erasOf(c.id, nodes, h).forEach(era =>
            out.push({ kind: 'cap', id: c.id + '@' + era, base: c.id, era, ref: c }));
          return;
        }
        (h.techByCap.get(c.id) || []).forEach(t =>
          out.push({ kind: 'tech', id: t.id, base: t.id, era: t.era, ref: t }));
      });
    });
    return out;
  }

  /* 把任意技术节点映射到它当前可见的承载单元 */
  function carrierOf(n, expanded) {
    if (expanded.has(n._domain) && expanded.has(n.cap)) return n.id;
    if (expanded.has(n._domain)) return n.cap + '@' + n.era;
    return n._domain + '@' + n.era;
  }

  /* ---------------- 进度汇总：L1/L0 的完成度由子节点加权得出 ---------------- */
  function progressOf(techNodes) {
    let sum = 0, cnt = 0, stat = {};
    techNodes.forEach(n => {
      const s = n._status || 'unknown';
      stat[s] = (stat[s] || 0) + 1;
      const w = statusById.get(s)?.weight;
      if (w !== null && w !== undefined) { sum += w; cnt++; }
    });
    return { pct: cnt ? sum / cnt : 0, counted: cnt, total: techNodes.length, stat };
  }

  /* 基准视图下用成熟度代替完成度，让基准树本身也有"进度"语义 */
  function maturityOf(techNodes) {
    if (!techNodes.length) return { pct: 0, total: 0 };
    const sum = techNodes.reduce((s, n) => s + ((maturityById.get(n.maturity)?.order || 0) / 5), 0);
    return { pct: sum / techNodes.length, total: techNodes.length };
  }

  /* ---------------- 依赖图：祖先链与后继链 ---------------- */
  function buildGraph(nodes) {
    const up = new Map(), down = new Map();
    nodes.forEach(n => { up.set(n.id, n.deps || []); if (!down.has(n.id)) down.set(n.id, []); });
    nodes.forEach(n => (n.deps || []).forEach(d => {
      if (!down.has(d)) down.set(d, []);
      down.get(d).push(n.id);
    }));
    return { up, down };
  }
  function reach(startIds, adj) {
    const seen = new Set(), stack = [...startIds];
    while (stack.length) {
      const id = stack.pop();
      (adj.get(id) || []).forEach(x => { if (!seen.has(x)) { seen.add(x); stack.push(x); } });
    }
    return seen;
  }

  /* ---------------- 规划模式：目标节点的最小依赖闭包 ----------------
   * 已建成的节点视为已满足，不再纳入路线；其余全部纳入。          */
  function planClosure(targetIds, byId, isBuilt) {
    const need = new Set(), stack = [...targetIds];
    while (stack.length) {
      const id = stack.pop();
      const n = byId.get(id); if (!n || need.has(id)) continue;
      if (isBuilt(n) && !targetIds.includes(id)) continue;
      need.add(id);
      (n.deps || []).forEach(d => { if (!need.has(d)) stack.push(d); });
    }
    return need;
  }

  /* 拓扑分层 + 年度产能约束的装箱排程 */
  function schedule(needSet, byId, capacityPerYear, startYear, isBuilt) {
    const ids = [...needSet];
    const indeg = new Map(), pending = new Map();
    ids.forEach(id => {
      const deps = (byId.get(id).deps || []).filter(d => needSet.has(d));
      pending.set(id, new Set(deps));
      indeg.set(id, deps.length);
    });
    const done = new Set(), plan = [];
    let year = startYear, guard = 0;
    while (done.size < ids.length && guard++ < 60) {
      const ready = ids.filter(id => !done.has(id) && pending.get(id).size === 0);
      if (!ready.length) {                       /* 兜底：避免异常数据导致死循环 */
        ids.filter(id => !done.has(id)).forEach(id => pending.get(id).clear());
        continue;
      }
      /* 同一批内优先做业务价值高、下游依赖多的 */
      ready.sort((a, b) => {
        const na = byId.get(a), nb = byId.get(b);
        return (nb.value || 0) - (na.value || 0) || (na.effort?.manMonth || 0) - (nb.effort?.manMonth || 0);
      });
      let used = 0; const batch = [];
      for (const id of ready) {
        const mm = byId.get(id).effort?.manMonth || 0;
        if (used > 0 && used + mm > capacityPerYear) continue;
        batch.push(id); used += mm;
        if (used >= capacityPerYear) break;
      }
      if (!batch.length) { batch.push(ready[0]); used = byId.get(ready[0]).effort?.manMonth || 0; }
      plan.push({ year, ids: batch, effort: used });
      batch.forEach(id => {
        done.add(id);
        ids.forEach(o => pending.get(o).delete(id));
      });
      year++;
    }
    return plan;
  }

  /* ---------------- 对比模式：单位 vs 另一单位（或基准） ---------------- */
  function compare(nodesA, nodesB) {
    const bById = new Map(nodesB.map(n => [n.id, n]));
    const score = n => {
      const w = statusById.get(n._status || 'unknown')?.weight;
      return w === null || w === undefined ? null : w;
    };
    return nodesA.map(a => {
      const b = bById.get(a.id);
      const sa = score(a), sb = b ? score(b) : null;
      let verdict = 'unknown';
      if (sa !== null && sb !== null) verdict = sa > sb + .01 ? 'ahead' : (sa < sb - .01 ? 'behind' : 'even');
      else if (sa !== null && sb === null) verdict = 'ahead';
      return { id: a.id, verdict, gap: (sa ?? 0) - (sb ?? 0) };
    });
  }

  /* 基准视图下的"落后"判定：拿单位状态与行业普及度对照 */
  function gapVsBenchmark(nodes) {
    const expect = { universal: 1.0, majority: 0.6, leaders: 0.3, pilot: 0.1, none: 0 };
    return nodes.map(n => {
      const w = statusById.get(n._status || 'unknown')?.weight;
      if (w === null || w === undefined) return { id: n.id, verdict: 'unknown', gap: 0 };
      const e = expect[n.adoption] ?? 0.3;
      const gap = w - e;
      return { id: n.id, verdict: gap > .12 ? 'ahead' : (gap < -.12 ? 'behind' : 'even'), gap };
    });
  }

  return {
    tx, capById, domById, archById, eraIdx, statusById, maturityById,
    adoptionById, autonomyById, tagById, awardsByNode,
    archOfCap, domainOfCap, orgList, orgById, resolve, hierarchy, descendants,
    visibleUnits, carrierOf, splitUnitId, erasOf, milestoneOf, progressOf, maturityOf,
    buildGraph, reach, planClosure, schedule, compare, gapVsBenchmark
  };
})();

</script>
<script>
/* ==== assets/layout.js ==== */
/* ==========================================================================
 * 金融科技树 · 布局层
 * 确定性网格布局：X 轴 = 时代，Y 轴 = 5A 架构泳道。
 * 不使用力导向图 —— 银行科技树需要稳定可预期的版面，每次打开位置一致。
 * 拥挤的时代列会自动分裂为多个子列，避免图形被拉得过高。
 * ========================================================================== */
var TT = (globalThis.TT = globalThis.TT || {});

TT.layout = (function () {
  const M = () => TT.model;

  const SIZE = {
    domain: { w: 208, h: 66 },
    cap:    { w: 198, h: 62 },
    tech:   { w: 200, h: 56 }
  };
  const SUB_GAP = 16;      /* 子列间距 */
  const COL_PAD = 46;      /* 时代列左右留白 */
  const LANE_PAD = 28, ROW_GAP = 14;
  const HEAD_H = 66, LEFT_W = 74;
  const TARGET_ROWS = 10;  /* 单格超过这么多节点才再细分子列 */
  /* 同代依赖深度不设业务上限 —— 有先后关系的节点绝不能画成垂直线，
   * 画布该多宽就多宽。20 只是防御异常数据的死循环保险丝。
   * 「紧凑模式」下才收紧到 1，用于必须一屏投影的场合。 */
  const MAX_DEPTH_FULL = 20, MAX_DEPTH_COMPACT = 1;

  /* 同一时代列内部的依赖深度 —— 让「手机银行 → 智能柜台」这类同代依赖
   * 也能左→右流动，而不是画成难看的回环。
   *
   * 技术层的依赖图是严格 DAG，可以直接排。但聚合视图（领域 / 能力）的
   * 单元级边会成环：领域 A 的某些技术依赖领域 B，同时 B 的另一些技术又
   * 依赖 A。所以先做一次贪心破环（按边权从大到小保留，成环就丢弃），
   * 在保留下来的无环子集上再算深度——保证主干依赖方向一致，
   * 少数被丢弃的弱边仍会画成回环，这是无法同时满足的部分。 */
  function localDepth(placed, edges, MAXD) {
    const col = new Map(placed.map(p => [p.id, p.col]));
    const intra = (edges || [])
      .filter(e => col.has(e.from) && col.has(e.to) && col.get(e.from) === col.get(e.to))
      .sort((x, y) => (y.weight || 1) - (x.weight || 1));

    /* 贪心破环：加入前先看反向是否已可达 */
    const adj = new Map();
    const reaches = (from, target) => {
      const seen = new Set(), st = [from];
      while (st.length) {
        const c = st.pop();
        if (c === target) return true;
        for (const n of (adj.get(c) || [])) if (!seen.has(n)) { seen.add(n); st.push(n); }
      }
      return false;
    };
    const kept = [];
    intra.forEach(e => {
      if (e.from === e.to || reaches(e.to, e.from)) return;   /* 会成环，丢弃 */
      if (!adj.has(e.from)) adj.set(e.from, []);
      adj.get(e.from).push(e.to);
      kept.push(e);
    });

    const depth = new Map(placed.map(p => [p.id, 0]));
    for (let i = 0; i <= MAXD && kept.length; i++) {
      let changed = false;
      kept.forEach(e => {
        const d = Math.min(depth.get(e.from) + 1, MAXD);
        if (depth.get(e.to) < d) { depth.set(e.to, d); changed = true; }
      });
      if (!changed) break;
    }
    return depth;
  }

  function compute(units, nodes, h, edges, opts) {
    opts = opts || {};
    const m = M(), tx = m.tx;

    /* --- 归位：每个单元的时代列与泳道 --- */
    const placed = units.map(u => {
      let col, arch, techs;
      if (u.kind === 'tech') {
        techs = [u.ref];
        arch = u.ref._arch;
      } else {
        techs = m.descendants(u.id, nodes, h);
        arch = u.kind === 'domain' ? u.ref.arch : m.archOfCap(u.base);
      }
      col = m.eraIdx.get(u.era);   /* 聚合单元也有确切的时代，不再取中位数 */
      const lane = tx.arch.find(a => a.id === arch)?.lane ?? 0;
      return { ...u, col, lane, arch, techs, ...SIZE[u.kind] };
    });

    /* --- 只保留真正有节点的时代列 ---
     * 聚合视图中很多早期时代不会成为任何单元的重心，
     * 保留空列会让整张图被挤到右半边。 */
    const used = tx.eras.map((_, ci) => placed.some(p => p.col === ci));
    const colOf = new Map();
    tx.eras.forEach((_, ci) => { if (used[ci]) colOf.set(ci, colOf.size); });
    placed.forEach(p => { p.col = colOf.get(p.col); });
    const eraList = tx.eras.filter((_, ci) => used[ci]);

    /* --- 同代依赖深度 → 子列序号 --- */
    const depth = localDepth(placed, edges, opts.compact ? MAX_DEPTH_COMPACT : MAX_DEPTH_FULL);
    placed.forEach(p => { p.depth = depth.get(p.id) || 0; });

    /* --- 子列规划：先按依赖深度分级，再按拥挤度在级内细分 --- */
    const plan = eraList.map((_, ci) => {
      const inCol = placed.filter(p => p.col === ci);
      const maxD = Math.max(0, ...inCol.map(p => p.depth));
      const levels = [];
      let offset = 0;
      for (let d = 0; d <= maxD; d++) {
        let worst = 0;
        tx.arch.forEach(a => {
          worst = Math.max(worst, inCol.filter(p => p.depth === d && p.lane === a.lane).length);
        });
        const width = Math.max(1, Math.ceil(worst / TARGET_ROWS));
        levels.push({ depth: d, offset, width });
        offset += width;
      }
      return { levels, subs: Math.max(1, offset) };
    });

    /* --- 列宽与列起点 --- */
    const nodeW = Math.max(...placed.map(p => p.w), SIZE.tech.w);
    const cols = eraList.map((e, i) => ({
      era: e, i, subs: plan[i].subs,
      w: plan[i].subs * nodeW + (plan[i].subs - 1) * SUB_GAP + COL_PAD * 2
    }));
    let cx = LEFT_W;
    cols.forEach(c => { c.x = cx; cx += c.w; });
    const width = cx + 20;

    /* --- 分格到（泳道, 时代列, 深度级） --- */
    const cells = new Map();
    placed.forEach(p => {
      p._lv = plan[p.col].levels.find(l => l.depth === p.depth) || { offset: 0, width: 1 };
      const k = p.lane + ':' + p.col + ':' + p._lv.offset;
      if (!cells.has(k)) cells.set(k, []);
      cells.get(k).push(p);
    });
    cells.forEach(list => list.sort((a, b) => {
      const key = x => (x.kind === 'tech' ? x.ref._domain + x.cap : x.kind === 'cap' ? x.ref.domain + x.id : x.id);
      return key(a) === key(b) ? String(a.id).localeCompare(String(b.id)) : key(a).localeCompare(key(b));
    }));

    /* --- 泳道高度：取该泳道中最高的一摞 --- */
    const laneNeed = new Map();
    cells.forEach((list, k) => {
      const lane = +k.split(':')[0];
      const rows = Math.ceil(list.length / list[0]._lv.width);
      const hh = list.slice(0, rows).reduce((s, p) => s + p.h + ROW_GAP, 0) - ROW_GAP;
      laneNeed.set(lane, Math.max(laneNeed.get(lane) || 0, hh));
    });

    /* 只保留有节点的泳道 —— 按架构线筛选时，空泳道不该占版面 */
    const lanes = tx.arch.filter(a => placed.some(p => p.lane === a.lane))
      .map(a => ({ ...a })).sort((a, b) => a.lane - b.lane);
    let y = HEAD_H;
    lanes.forEach(l => {
      l.h = Math.max(laneNeed.get(l.lane) || 0, 92) + LANE_PAD * 2;
      l.y = y; y += l.h;
    });
    const height = y + 28;

    /* --- 落位 --- */
    cells.forEach(list => {
      const p0 = list[0];
      const L = lanes.find(l => l.lane === p0.lane), C = cols[p0.col];
      const rows = Math.ceil(list.length / p0._lv.width);
      list.forEach((p, idx) => {
        const bucket = Math.floor(idx / rows), row = idx % rows;
        const colItems = list.slice(bucket * rows, bucket * rows + rows);
        const total = colItems.reduce((s, q) => s + q.h + ROW_GAP, 0) - ROW_GAP;
        const top = L.y + (L.h - total) / 2;
        p.sub = p0._lv.offset + bucket;
        p.x = C.x + COL_PAD + p.sub * (nodeW + SUB_GAP) + (nodeW - p.w) / 2;
        p.y = top + colItems.slice(0, row).reduce((s, q) => s + q.h + ROW_GAP, 0);
        p.cx = p.x + p.w / 2;
        p.cy = p.y + p.h / 2;
      });
    });

    return { units: placed, lanes, cols, width, height, LEFT_W, HEAD_H };
  }

  /* 依赖连线：左出右进的三次贝塞尔；逆向或同列时从下方绕行 */
  function edgePath(a, b) {
    const x1 = a.x + a.w, y1 = a.cy, x2 = b.x, y2 = b.cy;
    if (x2 - x1 > 22) {
      const dx = Math.max(36, (x2 - x1) * 0.45);
      return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    }
    const sx = a.cx, sy = a.y + a.h, ex = b.cx, ey = b.y + b.h;
    const drop = 32 + Math.abs(sy - ey) * .18;
    return `M${sx},${sy} C${sx},${sy + drop} ${ex},${ey + drop} ${ex},${ey}`;
  }

  return { compute, edgePath, SIZE };
})();

</script>
<script>
/* ==== assets/render.js ==== */
/* ==========================================================================
 * 金融科技树 · 渲染层（SVG）
 * ========================================================================== */
var TT = (globalThis.TT = globalThis.TT || {});

TT.render = (function () {
  const NS = 'http://www.w3.org/2000/svg';
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* 中英文混排的近似宽度测量，用于截断标题 */
  function textWidth(s, size) {
    let w = 0;
    for (const ch of String(s)) w += /[　-鿿＀-￯]/.test(ch) ? size : size * 0.55;
    return w;
  }
  function fit(s, maxW, size) {
    if (textWidth(s, size) <= maxW) return s;
    let out = '';
    for (const ch of String(s)) {
      if (textWidth(out + ch, size) > maxW - size * 0.8) break;
      out += ch;
    }
    return out + '…';
  }

  /* 卡片外形：左上、右下切角的六边形。两套主题统一用它 ——
   * 这个形状是科技树的识别符号，不该因为换主题就退化成普通圆角矩形。 */
  function shapePath(x, y, w, h) {
    const c = Math.min(13, h / 3);
    return `M${x + c},${y} L${x + w},${y} L${x + w},${y + h - c} L${x + w - c},${y + h} L${x},${y + h} L${x},${y + c} Z`;
  }

  const hsl = (h, s, l, a) => `hsla(${h},${s}%,${l}%,${a})`;

  /* 亮色主题下把调色板压暗、提饱和：同一套语义色，两种底色都能读 */
  function toneFor(hex, theme) {
    if (theme !== 'B' || typeof hex !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(hex)) return hex;
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l0 = (mx + mn) / 2, d = mx - mn;
    let h = 0, sat = 0;
    if (d) {
      sat = l0 > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h /= 6;
    }
    const L = Math.min(l0 * 0.66, 0.40);          /* 压暗 */
    const S = Math.min(sat * 1.18 + .06, 0.88);   /* 提饱和 */
    const q = L < .5 ? L * (1 + S) : L + S - L * S, pp = 2 * L - q;
    const f = t => {
      t = (t + 1) % 1;
      return t < 1 / 6 ? pp + (q - pp) * 6 * t : t < 1 / 2 ? q
           : t < 2 / 3 ? pp + (q - pp) * (2 / 3 - t) * 6 : pp;
    };
    const to = v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0');
    return '#' + to(f(h + 1 / 3)) + to(f(h)) + to(f(h - 1 / 3));
  }

  /* ---------------- 着色：由当前着色维度决定 ---------------- */
  function colorOf(u, st) {
    return toneFor(colorRaw(u, st), st.theme);
  }

  function colorRaw(u, st) {
    const m = TT.model, mode = st.colorMode;
    const techs = u.techs || [];
    if (mode === 'status') {
      if (st.orgId === 'benchmark') return colorRaw(u, { ...st, colorMode: 'maturity' });
      if (u.kind === 'tech') return m.statusById.get(u.ref._status || 'unknown')?.color || '#64748b';
      const p = m.progressOf(techs).pct;
      return p >= .85 ? '#4ade80' : p >= .5 ? '#a3e635' : p >= .25 ? '#fbbf24' : p > 0 ? '#60a5fa' : '#64748b';
    }
    if (mode === 'maturity') {
      if (u.kind === 'tech') return m.maturityById.get(u.ref.maturity)?.color || '#64748b';
      const avg = m.maturityOf(techs).pct;
      return avg >= .88 ? '#4ade80' : avg >= .72 ? '#22d3ee' : avg >= .55 ? '#818cf8' : avg >= .38 ? '#c084fc' : '#f472b6';
    }
    if (mode === 'autonomy') {
      if (u.kind === 'tech') return m.autonomyById.get(u.ref.autonomy)?.color || '#64748b';
      const rank = { full: 3, partial: 2, dependent: 1, na: 3 };
      const avg = techs.length ? techs.reduce((s, t) => s + (rank[t.autonomy] || 2), 0) / techs.length : 2;
      return avg >= 2.7 ? '#4ade80' : avg >= 2.2 ? '#fbbf24' : '#f87171';
    }
    if (mode === 'value') {
      const v = u.kind === 'tech' ? (u.ref.value || 3)
        : (techs.length ? techs.reduce((s, t) => s + (t.value || 3), 0) / techs.length : 3);
      return v >= 4.6 ? '#f5c451' : v >= 4 ? '#fbbf24' : v >= 3.2 ? '#60a5fa' : '#64748b';
    }
    if (mode === 'lifecycle') {
      if (u.kind === 'tech') return (m.tx.lifecycle.find(l => l.id === (u.ref.lifecycle || 'active')) || {}).color;
      const bad = techs.filter(t => t.lifecycle && t.lifecycle !== 'active').length;
      const r = techs.length ? bad / techs.length : 0;
      return r >= .5 ? '#f87171' : r > 0 ? '#94a3b8' : '#4ade80';
    }
    if (mode === 'award') {
      const n = techs.reduce((s, t) => s + (t._awards?.length || 0), 0);
      return n >= 4 ? '#f5c451' : n >= 2 ? '#d9a441' : n >= 1 ? '#8a7a4a' : '#4a5568';
    }
    if (mode === 'gap') {
      const v = st.gapMap?.get(u.id);
      if (u.kind === 'tech') {
        return v === 'ahead' ? '#f5c451' : v === 'behind' ? '#f87171' : v === 'even' ? '#7f8ea3' : '#3f4a5e';
      }
      let a = 0, b = 0, k = 0;
      techs.forEach(t => {
        const x = st.gapMap?.get(t.id);
        if (x === 'ahead') a++; else if (x === 'behind') b++; else if (x === 'even') k++;
      });
      return b > a ? '#f87171' : a > b ? '#f5c451' : (k ? '#7f8ea3' : '#3f4a5e');
    }
    return '#64748b';
  }

  /* 双向依赖的弧线：从两个节点的同侧引出并向外凸，两端都带箭头，
   * 一眼能和普通的单向依赖区分开。 */
  function bidirPath(a, b) {
    const sameCol = Math.abs(a.cx - b.cx) < 12;
    if (sameCol) {
      const x = a.x + a.w, bow = 54 + Math.abs(a.cy - b.cy) * 0.16;
      return `M${x + 4},${a.cy} C${x + bow},${a.cy} ${x + bow},${b.cy} ${x + 4},${b.cy}`;
    }
    /* 起点永远是 a、终点永远是 b，箭头方向才不会画反 */
    const up = Math.min(a.cy, b.cy) - 46;
    return `M${a.cx},${a.y} Q${(a.cx + b.cx) / 2},${up} ${b.cx},${b.y}`;
  }

  /* ---------------- 主绘制 ---------------- */
  function draw(svg, L, st) {
    const m = TT.model, tx = m.tx;
    const parts = [];

    /* --- defs --- */
    const hatchCol = st.theme === 'B' ? 'rgba(30,45,70,.30)' : 'rgba(220,232,250,.26)';
    parts.push(`<defs>
      <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
      </marker>
      <marker id="arw-a" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
        <path d="M0,0.5 L9,4.5 L0,8.5 z" fill="context-stroke"/>
      </marker>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="${hatchCol}" stroke-width="2.2"/>
      </pattern>
    </defs>`);

    /* --- 背景：泳道走色相，时代走明度 + 彩虹色带 ---
     * 两个维度刻意走不同的视觉通道，避免和节点的语义着色打架。
     * 所有颜色用行内属性而非 class，保证导出 PNG 时不依赖外部 CSS。 */
    const light = st.theme === 'B';
    /* 五条泳道一视同仁：安全架构不再用更重的底色特殊突出，
     * 它的横切性质由「贯穿」标签和位置表达，不靠颜色喊。 */
    /* 泳道只留很淡的底色，身份主要靠左侧色条和冻结列的色标表达；
     * 时代是主背景层，明度差拉开，画在泳道之上才不会被盖住。 */
    const laneTint = hue => light ? `hsla(${hue},58%,46%,.045)` : `hsla(${hue},68%,58%,.045)`;
    const laneBar  = hue => light ? `hsl(${hue},58%,44%)` : `hsl(${hue},70%,60%)`;
    const eraTint = i => {
      const t = tx.eras.length > 1 ? i / (tx.eras.length - 1) : 0;
      return light ? `rgba(22,44,80,${(0.022 + t * 0.072).toFixed(3)})`
                   : `rgba(200,224,255,${(0.018 + t * 0.068).toFixed(3)})`;
    };
    const eraBar = hue => light ? `hsl(${hue},55%,46%)` : `hsl(${hue},72%,64%)`;

    const bg = [];
    const bodyTop = L.HEAD_H, bodyH = L.height - L.HEAD_H;

    /* ① 泳道底色与左侧色条（很淡，只做归属提示） */
    L.lanes.forEach(l => {
      bg.push(`<rect x="0" y="${l.y}" width="${L.width}" height="${l.h}" fill="${laneTint(l.hue)}"/>`);
      bg.push(`<rect x="0" y="${l.y + 3}" width="6" height="${l.h - 6}" rx="3" fill="${laneBar(l.hue)}" opacity=".9"/>`);
    });

    /* ② 时代列：主背景层，画在泳道之上 */
    L.cols.forEach(c => {
      const i = tx.eras.indexOf(c.era), hue = c.era.hue ?? 210, cx = c.x + c.w / 2;
      bg.push(`<rect x="${c.x}" y="${bodyTop}" width="${c.w}" height="${bodyH}" fill="${eraTint(i)}"/>`);
      bg.push(`<text x="${cx}" y="${L.height - 22}" text-anchor="middle" font-size="150" font-weight="700"
        fill="${eraBar(hue)}" opacity="${light ? .05 : .055}" pointer-events="none">${c.era.roman}</text>`);
      bg.push(`<rect x="${c.x + 8}" y="${bodyTop - 8}" width="${c.w - 16}" height="4" rx="2" fill="${eraBar(hue)}" opacity=".8"/>`);
      bg.push(`<line x1="${c.x}" y1="${bodyTop - 8}" x2="${c.x}" y2="${L.height}" stroke="${eraBar(hue)}" stroke-opacity="${light ? .22 : .26}" stroke-width="1"/>`);
    });
    bg.push(`<line x1="${L.width}" y1="${bodyTop - 8}" x2="${L.width}" y2="${L.height}" stroke="var(--grid)" stroke-width="1"/>`);

    /* ③ 泳道分隔线画在最上层，保证行的边界清楚 */
    L.lanes.forEach(l => bg.push(`<line class="lane-line" x1="0" y1="${l.y}" x2="${L.width}" y2="${l.y}"/>`));
    const lastLane = L.lanes.at(-1);
    bg.push(`<line class="lane-line" x1="0" y1="${lastLane.y + lastLane.h}" x2="${L.width}" y2="${lastLane.y + lastLane.h}"/>`);

    parts.push(`<g class="bg">${bg.join('')}</g>`);

    /* --- 跨 5A 宽卡片的背景带（如「人工智能与大模型」领域） --- */
    const spans = [];
    const spanGroups = new Map();
    L.units.forEach(u => {
      if (u.kind === 'domain' && u.ref.spanArch?.length) {
        const g = spanGroups.get(u.base) || { x0: Infinity, x1: -Infinity };
        g.x0 = Math.min(g.x0, u.x); g.x1 = Math.max(g.x1, u.x + u.w);
        spanGroups.set(u.base, g);
      }
    });
    spanGroups.forEach(g => {
      const top = L.lanes[0].y, bot = L.lanes.at(-1).y + L.lanes.at(-1).h;
      const x = g.x0 - 16, w = g.x1 - g.x0 + 32;
      spans.push(`<rect class="spanband" x="${x}" y="${top}" width="${w}" height="${bot - top}" rx="10"/>`);
      spans.push(`<rect class="spanband-edge" x="${x}" y="${top}" width="${w}" height="${bot - top}" rx="10"/>`);
      spans.push(`<text class="spanband-tip" x="${x + w / 2}" y="${top + 16}" text-anchor="middle">横跨全部 5A 架构线</text>`);
    });
    if (spans.length) parts.push(`<g class="spans">${spans.join('')}</g>`);

    /* --- 依赖连线 --- */
    const pos = new Map(L.units.map(u => [u.id, u]));
    const edges = [];
    st.edges.forEach(e => {
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) return;
      const w = Math.min(4.2, 1 + Math.log2(e.weight + 1) * 0.95);
      if (e.bidir) {
        if (!e.primary) return;                       /* 一对只画一条 */
        edges.push(`<path class="edge bidir" d="${bidirPath(a, b)}" stroke-width="${Math.max(1.8, w).toFixed(2)}"` +
          ` marker-start="url(#arw-a)" marker-end="url(#arw-a)"` +
          ` data-from="${esc(e.from)}" data-to="${esc(e.to)}" data-bidir="1"><title>` +
          `双向依赖：两者在本时代互为前置，下钻到技术层可见具体是哪几条</title></path>`);
        return;
      }
      if (e.reverse) {
        edges.push(`<path class="edge cyc" d="${bidirPath(a, b)}" stroke-width="${Math.max(1.8, w).toFixed(2)}"` +
          ` marker-end="url(#arw-a)" data-from="${esc(e.from)}" data-to="${esc(e.to)}"><title>` +
          `环路依赖：本时代内存在多个领域互相牵制的环，这一条只能画成回折；下钻到技术层即消失</title></path>`);
        return;
      }
      const cls = ['edge'];
      if (st.lockedEdges?.has(e.from + '>' + e.to)) cls.push('locked');
      edges.push(`<path class="${cls.join(' ')}" d="${TT.layout.edgePath(a, b)}" stroke-width="${w.toFixed(2)}"` +
        ` data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`);
    });
    parts.push(`<g class="edges">${edges.join('')}</g>`);

    /* --- 节点 --- */
    const nodes = [];
    L.units.forEach(u => {
      const color = colorOf(u, st);
      const isTech = u.kind === 'tech';
      const locked = isTech && st.orgId !== 'benchmark' &&
        (u.ref._status === 'unknown' || u.ref._status === 'none');
      const titleSize = u.kind === 'domain' ? 14.5 : u.kind === 'cap' ? 13 : 12.5;
      const g = [];

      g.push(`<path class="shape" d="${shapePath(u.x, u.y, u.w, u.h)}"` +
        ` fill="${color}22" stroke="${color}" style="color:${color}"/>`);

      const padX = 12;
      let ty = u.y + (isTech ? 21 : 22);
      /* 聚合格的主标题是「该时代的里程碑名」而不是领域名 ——
       * 否则同一个领域在五个时代里会显示五个一模一样的标题。 */
      const heading = isTech ? u.ref.name : (u._milestone || u.ref.name);
      g.push(`<text class="title" x="${u.x + padX}" y="${ty}" font-size="${titleSize}">` +
        `${esc(fit(heading, u.w - padX - (isTech ? 46 : 42), titleSize))}</text>`);

      if (isTech) {
        const n = u.ref;
        /* 技术节点也有环：基准视图下画成熟度（5 档按比例），单位视图下画建设状态。
         * 这样任何粒度下"环"的语义一致，扫一眼就知道深浅。 */
        const R = 13, cx = u.x + u.w - R - 11, cy2 = u.y + u.h / 2, C = 2 * Math.PI * R;
        const mat = m.maturityById.get(n.maturity);
        const ratio = st.orgId === 'benchmark'
          ? (mat?.order || 0) / 5
          : (m.statusById.get(n._status || 'unknown')?.weight ?? 0);
        g.push(`<circle class="ring-bg" cx="${cx}" cy="${cy2}" r="${R}"/>`);
        g.push(`<circle class="ring-fg" cx="${cx}" cy="${cy2}" r="${R}" stroke="${color}"` +
          ` stroke-dasharray="${(C * ratio).toFixed(1)} ${C.toFixed(1)}"` +
          ` style="transform-origin:${cx}px ${cy2}px"/>`);
        if (st.orgId !== 'benchmark')
          g.push(`<text class="cnt" x="${cx}" y="${cy2 + 3.6}" text-anchor="middle" font-size="9.5">${Math.round(ratio * 100)}</text>`);

        const bits = [];
        if (st.orgId === 'benchmark') {
          bits.push(m.maturityById.get(n.maturity)?.name || '');
          bits.push(m.adoptionById.get(n.adoption)?.name || '');
        } else {
          bits.push(m.statusById.get(n._status || 'unknown')?.name || '');
          if (n.owner) bits.push(n.owner);
        }
        const avail = u.w - padX - R * 2 - 20;
        g.push(`<text class="meta" x="${u.x + padX}" y="${u.y + u.h - 12}">${esc(fit(bits.filter(Boolean).join(' · '), avail, 10))}</text>`);
        if (n._awards.length) g.push(`<text class="award" x="${u.x + u.w - R * 2 - 24}" y="${u.y + u.h - 11}">🏆</text>`);
        if (n._status === 'building')
          g.push(`<path class="building-ring" d="${shapePath(u.x - 3, u.y - 3, u.w + 6, u.h + 6)}"/>`);
      } else {
        /* 自由布局下的聚合节点：进度环 + 子节点统计 */
        const prog = st.orgId === 'benchmark' ? m.maturityOf(u.techs) : m.progressOf(u.techs);
        const R = u.kind === 'domain' ? 15 : 12;
        const cx = u.x + u.w - R - 13, cy2 = u.y + u.h / 2;
        const C = 2 * Math.PI * R;
        g.push(`<circle class="ring-bg" cx="${cx}" cy="${cy2}" r="${R}"/>`);
        g.push(`<circle class="ring-fg" cx="${cx}" cy="${cy2}" r="${R}" stroke="${color}"` +
          ` stroke-dasharray="${(C * prog.pct).toFixed(1)} ${C.toFixed(1)}"` +
          ` style="transform-origin:${cx}px ${cy2}px"/>`);
        g.push(`<text class="cnt" x="${cx}" y="${cy2 + 4}" text-anchor="middle" font-size="${u.kind === 'domain' ? 11.5 : 10}">${Math.round(prog.pct * 100)}</text>`);

        const owner = `${u.ref.name} · ${u.techs.length} 项`;
        g.push(`<text class="owner" x="${u.x + padX}" y="${u.y + u.h - 24}">${esc(fit(owner, u.w - padX - R * 2 - 20, 10))}</text>`);
        const s = st.orgId === 'benchmark'
          ? (m.maturityById.get([...u.techs].sort((a, b) =>
              (m.maturityById.get(b.maturity)?.order || 0) - (m.maturityById.get(a.maturity)?.order || 0))[0]?.maturity)?.name || '')
          : (() => { const c = m.progressOf(u.techs).stat;
              return `建成 ${c.built || 0} · 在建 ${c.building || 0} · 未启 ${(c.none || 0) + (c.unknown || 0)}`; })();
        g.push(`<text class="meta" x="${u.x + padX}" y="${u.y + u.h - 10}">${esc(fit(s, u.w - padX - R * 2 - 20, 10))}</text>`);

        const aw = u.techs.reduce((a, t) => a + (t._awards?.length || 0), 0);
        if (aw) g.push(`<text class="award" x="${u.x + u.w - R * 2 - 24}" y="${u.y + 19}">🏆</text>`);
      }

      /* 退役 / 存量维持的技术叠一层斜纹 + 角标，
       * 任何着色维度下都能看见 —— 不用置灰是因为置灰在状态维度里已表示「未建成」 */
      const dead = isTech ? 0 : u.techs.filter(t => t.lifecycle && t.lifecycle !== 'active').length;
      const lc = isTech ? (u.ref.lifecycle || 'active')
        : (dead * 2 < u.techs.length ? 'active'
          : u.techs.some(t => t.lifecycle === 'sunset') ? 'sunset' : 'legacy');
      if (lc !== 'active') {
        g.push(`<path d="${shapePath(u.x, u.y, u.w, u.h)}" fill="url(#hatch)"
          opacity="${isTech ? 1 : .55}" pointer-events="none"/>`);
        if (isTech) g.push(`<text class="badge-txt" x="${u.x + u.w - 40}" y="${u.y + 13}" text-anchor="end"
          fill="${lc === 'sunset' ? '#f87171' : '#94a3b8'}">${lc === 'sunset' ? '退役 ↓' : '存量'}</text>`);
      }

      if (!isTech) {
        const ix = u.x + u.w - 11, iy = u.y + 11;
        g.push(`<circle class="info-dot" cx="${ix}" cy="${iy}" r="8.5"/>`);
        g.push(`<text class="info-i" x="${ix}" y="${iy + 3.6}" text-anchor="middle">i</text>`);
      }

      const cls = ['node', 'k-' + u.kind, 'lc-' + lc];
      if (locked) cls.push('locked');
      nodes.push(`<g class="${cls.join(' ')}" data-id="${esc(u.id)}" data-kind="${u.kind}" style="color:${color}">${g.join('')}</g>`);
    });
    parts.push(`<g class="nodes">${nodes.join('')}</g>`);

    svg.innerHTML = parts.join('');
  }

  return { draw, colorOf, toneFor, fit, esc, shapePath, textWidth };
})();

</script>
<script>
/* ==== assets/ui.js ==== */
/* ==========================================================================
 * 金融科技树 · 界面层：详情抽屉、规划路线图、奖项热力图、导出、演示、维护
 * ========================================================================== */
var TT = (globalThis.TT = globalThis.TT || {});

TT.ui = (function () {
  const $ = s => document.querySelector(s);
  const M = () => TT.model;
  const esc = s => TT.render.esc(s);
  let S, api;

  function init(state, apis) { S = state; api = apis; }

  /* ---------------- 通用 ---------------- */
  function toast(msg, ms) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms || 2600);
  }
  function modal(title, sub, bodyHTML, footHTML) {
    closeModal();
    const wrap = document.createElement('div');
    wrap.className = 'modal-mask';
    wrap.innerHTML = `<div class="modal">
      <div class="modal-head">
        <div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
        <button class="btn sm ghost" data-close>✕</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ''}
    </div>`;
    wrap.addEventListener('click', e => {
      if (e.target === wrap || e.target.hasAttribute('data-close')) closeModal();
    });
    $('#modals').appendChild(wrap);
    return wrap;
  }
  const closeModal = () => { $('#modals').innerHTML = ''; };

  function download(name, content, mime) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* ---------------- 详情抽屉 ---------------- */
  function closeDrawer() { $('#drawer').classList.remove('open'); }

  function openDrawer(id) {
    const m = M();
    const { base, era } = m.splitUnitId(id);
    $('#drawer').classList.add('open');
    if (S.byId.has(base)) return drawTech(S.byId.get(base));
    const cap = m.capById.get(base), dom = m.domById.get(base);
    if (cap) return drawAggregate(cap, 'cap', id, era);
    if (dom) return drawAggregate(dom, 'domain', id, era);
  }

  function archChip(archId) {
    const a = M().archById.get(archId);
    return a ? `<span class="tag" style="border-color:hsl(${a.hue},60%,50%);color:hsl(${a.hue},70%,70%)">${a.code} ${a.name}</span>` : '';
  }

  function drawTech(n) {
    const m = M();
    const era = m.tx.eras.find(e => e.id === n.era);
    const cap = m.capById.get(n.cap), dom = m.domById.get(cap.domain);
    $('#dwTitle').textContent = n.name;
    $('#dwEn').textContent = `${n.en || ''}　·　${n.id}`;
    $('#dwTags').innerHTML = [
      `<span class="tag">${era.roman} ${era.name}</span>`,
      archChip(n._arch),
      `<span class="tag">${dom.name} › ${cap.name}</span>`,
      ...(n.tags || []).map(t => {
        const tg = m.tagById.get(t);
        return `<span class="tag" style="border-color:${tg.color};color:${tg.color}">${tg.name.replace('视图', '')}</span>`;
      }),
      n._custom ? `<span class="tag" style="border-color:#4ade80;color:#4ade80">本单位自建</span>` : ''
    ].filter(Boolean).join('');

    const deps = (n.deps || []).map(d => S.byId.get(d)).filter(Boolean);
    const nexts = S.nodes.filter(x => (x.deps || []).includes(n.id));
    const gate = deps.filter(d => d._arch === 'A5' && n._arch !== 'A5');
    const benchmark = S.orgId === 'benchmark';

    const sections = [];

    sections.push(`<div class="dw-sec"><p>${esc(n.desc)}</p></div>`);

    if (n.pitfall) sections.push(`<div class="dw-sec"><div class="callout">⚠ ${esc(n.pitfall)}</div></div>`);
    const lc = m.tx.lifecycle.find(l => l.id === (n.lifecycle || 'active'));
    if (n.lifecycle && n.lifecycle !== 'active') {
      const rep = (n.supersededBy || []).map(x => S.byId.get(x)).filter(Boolean);
      sections.push(`<div class="dw-sec"><div class="callout" style="border-color:${lc.color};background:${lc.color}14;color:${lc.color}">
        <b>${lc.name}</b> · ${esc(lc.desc)}<br>${esc(n.sunsetNote || '')}
        ${rep.length ? `<div style="margin-top:6px">替代方向：${rep.map(r => `<span class="chip" data-go="${r.id}">${esc(r.name)}</span>`).join(' ')}</div>` : ''}
      </div></div>`);
    }
    if (gate.length) sections.push(`<div class="dw-sec"><div class="callout gate">🔒 合规闸门：本节点受安全架构约束，前置为 ${gate.map(g => esc(g.name)).join('、')}</div></div>`);

    /* 维护模式：编辑基准节点本身（任何视图下都可用，改的是 data/nodes.js 的内容） */
    if (S.maintain) {
      const opt = (list, cur) => list.map(o => `<option value="${o.id}" ${o.id === cur ? 'selected' : ''}>${o.name}</option>`).join('');
      sections.push(`<div class="dw-sec"><h3>基准节点编辑（维护模式）</h3>
        <div class="editrow"><label>名称</label><input id="bName" value="${esc(n.name)}"></div>
        <div class="editrow"><label>英文名</label><input id="bEn" value="${esc(n.en || '')}"></div>
        <div class="editrow"><label>时代</label><select id="bEra">${opt(m.tx.eras.map(e => ({ id: e.id, name: e.roman + ' ' + e.name })), n.era)}</select></div>
        <div class="editrow"><label>所属能力</label><select id="bCap">${opt(m.tx.capabilities.map(c => ({ id: c.id, name: m.domById.get(c.domain).name + ' › ' + c.name })), n.cap)}</select></div>
        <div class="editrow"><label>成熟度</label><select id="bMat">${opt(m.tx.maturity, n.maturity)}</select></div>
        <div class="editrow"><label>普及度</label><select id="bAdo">${opt(m.tx.adoption, n.adoption)}</select></div>
        <div class="editrow"><label>置信度</label><select id="bConf">${opt(m.tx.confidence, n.confidence)}</select></div>
        <div class="editrow"><label>信创</label><select id="bAuto">${opt(m.tx.autonomy, n.autonomy)}</select></div>
        <div class="editrow"><label>人月 / 月</label><input id="bEff" value="${n.effort?.manMonth || 0} / ${n.effort?.months || 0}"></div>
        <div class="editrow"><label>价值 / 风险</label><input id="bVR" value="${n.value} / ${n.risk}"></div>
        <div class="editrow"><label>前置 ID</label><input id="bDeps" value="${(n.deps || []).join(',')}" placeholder="逗号分隔，如 T6013,T9026"></div>
        <div class="editrow"><label>定位</label><textarea id="bDesc">${esc(n.desc || '')}</textarea></div>
        <div class="editrow"><label>常见坑</label><textarea id="bPit">${esc(n.pitfall || '')}</textarea></div>
        <button class="btn sm" id="bSave">应用到基准树</button>
        <button class="btn sm ghost" id="bExport">导出 nodes.js</button>
        <p style="color:var(--text-faint);font-size:11.5px;margin-top:7px">
          改动先落在内存里，导出 nodes.js 覆盖 data/nodes.js 才会持久化。</p></div>`);
    }

    /* 单位状态 / 维护编辑 */
    if (!benchmark) {
      if (S.maintain) {
        sections.push(`<div class="dw-sec"><h3>本单位状态（维护模式）</h3>
          <div class="editrow"><label>状态</label><select id="edStatus">${m.tx.status.map(s => `<option value="${s.id}" ${n._status === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select></div>
          <div class="editrow"><label>信创</label><select id="edAuto">${m.tx.autonomy.map(s => `<option value="${s.id}" ${n.autonomy === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select></div>
          <div class="editrow"><label>责任部门</label><input id="edOwner" value="${esc(n.owner || '')}"></div>
          <div class="editrow"><label>启动</label><input id="edStart" placeholder="2025-06" value="${esc(n.start || '')}"></div>
          <div class="editrow"><label>目标</label><input id="edTarget" placeholder="2027-12" value="${esc(n.target || '')}"></div>
          <div class="editrow"><label>备注</label><textarea id="edNote">${esc(n.note || '')}</textarea></div>
          <button class="btn sm" id="edSave">保存到本单位档案</button></div>`);
      } else {
        const st = m.statusById.get(n._status || 'unknown');
        sections.push(`<div class="dw-sec"><h3>本单位状态</h3>
          <div class="status-picker">${m.tx.status.map(s =>
            `<button class="chip" data-status="${s.id}" style="${s.id === n._status ? `border-color:${s.color};color:${s.color}` : ''}">${s.name}</button>`).join('')}</div>
          <dl class="kv" style="margin-top:9px">
            ${n.owner ? `<dt>责任部门</dt><dd>${esc(n.owner)}</dd>` : ''}
            ${n.start ? `<dt>启动</dt><dd>${esc(n.start)}</dd>` : ''}
            ${n.target ? `<dt>目标</dt><dd>${esc(n.target)}</dd>` : ''}
          </dl>
          ${n.note ? `<p style="margin-top:7px">${esc(n.note)}</p>` : ''}</div>`);
      }
    }

    /* 行业判断 */
    sections.push(`<div class="dw-sec"><h3>行业判断</h3><dl class="kv">
      <dt>生命周期</dt><dd style="color:${lc.color}">${lc.name}　<span style="color:var(--text-faint)">${lc.desc}</span></dd>
      <dt>技术成熟度</dt><dd>${m.maturityById.get(n.maturity)?.name || '—'}　<span style="color:var(--text-faint)">${m.maturityById.get(n.maturity)?.desc || ''}</span></dd>
      <dt>行业普及度</dt><dd>${m.adoptionById.get(n.adoption)?.name || '—'}</dd>
      <dt>自主可控</dt><dd>${m.autonomyById.get(n.autonomy)?.name || '—'}</dd>
      <dt>业务价值</dt><dd>${'★'.repeat(n.value || 0)}${'☆'.repeat(5 - (n.value || 0))}</dd>
      <dt>实施风险</dt><dd>${'●'.repeat(n.risk || 0)}${'○'.repeat(5 - (n.risk || 0))}</dd>
      <dt>基准投入</dt><dd>${n.effort?.manMonth || '—'} 人月 · 约 ${n.effort?.months || '—'} 个月</dd>
    </dl></div>`);

    if (n.unlocks?.length)
      sections.push(`<div class="dw-sec"><h3>解锁能力</h3><ul class="tight">${n.unlocks.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>`);

    sections.push(`<div class="dw-sec"><h3>前置技术 ${deps.length}</h3>${deps.length
      ? `<div class="chips">${deps.map(d => `<span class="chip" data-go="${d.id}">${esc(d.name)}</span>`).join('')}</div>`
      : '<p style="color:var(--text-faint)">无前置，是本条线的起点</p>'}</div>`);

    sections.push(`<div class="dw-sec"><h3>后继技术 ${nexts.length}</h3>${nexts.length
      ? `<div class="chips">${nexts.map(d => `<span class="chip" data-go="${d.id}">${esc(d.name)}</span>`).join('')}</div>`
      : '<p style="color:var(--text-faint)">暂无后继节点</p>'}</div>`);

    if (n.stack?.length)
      sections.push(`<div class="dw-sec"><h3>技术选型参考</h3><div class="chips">${n.stack.map(s => `<span class="chip static">${esc(s)}</span>`).join('')}</div></div>`);

    /* 判断依据 —— 明确区分「有证据」与「未经核实」 */
    const conf = m.confidence?.get ? null : M().tx.confidence.find(c => c.id === n.confidence);
    const evRows = (n._awards || []).map(a => `<div class="ev-row">
      <div>🏆 ${esc(a.year)} 年度 ${esc(a.level)} · ${esc(a.org)}</div>
      <div style="color:var(--text-dim)">${esc(a.project)}</div>
      <div class="ev-meta">${esc(a.source || '')}${a.verified ? ` · 核实程度：${a.verified === 'official' ? '官方名单' : a.verified === 'snippet' ? '检索片段（待与官方 PDF 复核）' : '二手归纳（待复核）'}` : ''}
        ${a.url ? ` · <a href="${esc(a.url)}" target="_blank" rel="noopener">来源链接</a>` : ''}</div></div>`).join('');

    sections.push(`<div class="dw-sec"><h3>判断依据</h3><div class="evidence">
      <div class="ev-row"><div>成熟度与普及度判断置信度：<b>${conf?.name || '—'}</b></div>
        <div class="ev-meta">${conf ? esc(conf.desc) : ''}</div></div>
      ${evRows || `<div class="ev-row unverified">暂无关联的金融科技发展奖记录。注意：未获奖不代表机构未建设，本工具不做反向推断。</div>`}
      ${n.confidence === 'low' ? `<div class="ev-row unverified">本节点判断以推断为主，建议结合行内调研与官方名单核实后修正。</div>` : ''}
    </div></div>`);

    $('#dwBody').innerHTML = sections.join('');
    bindDrawerEvents(n);
  }

  function bindDrawerEvents(n) {
    $('#dwBody').querySelectorAll('[data-go]').forEach(c => c.onclick = () => {
      const id = c.dataset.go;
      const t = S.byId.get(id);
      if (t) { S.expanded.add(t._domain); S.expanded.add(t.cap); TT.rebuild(); }
      S.selected = id; openDrawer(id); api.applyHighlight(); api.centerOn(id, true);
    });
    $('#dwBody').querySelectorAll('[data-status]').forEach(b => b.onclick = () => {
      setOverride(n.id, { status: b.dataset.status });
      TT.rebuild(); openDrawer(n.id);
    });
    const bSave = $('#bSave');
    if (bSave) bSave.onclick = () => {
      const raw = TT.nodes.find(x => x.id === n.id);
      if (!raw) return toast('本单位自建节点请在单位档案里维护');
      const [mm, mo] = $('#bEff').value.split('/').map(x => parseInt(x.trim(), 10) || 0);
      const [va, ri] = $('#bVR').value.split('/').map(x => parseInt(x.trim(), 10) || 3);
      const deps = $('#bDeps').value.split(',').map(x => x.trim()).filter(Boolean);
      const missing = deps.filter(d => !TT.nodes.some(x => x.id === d));
      if (missing.length) return toast('这些前置 ID 不存在：' + missing.join('、'));
      if (deps.includes(n.id)) return toast('节点不能依赖自己');
      Object.assign(raw, {
        name: $('#bName').value.trim() || raw.name, en: $('#bEn').value.trim(),
        era: $('#bEra').value, cap: $('#bCap').value,
        maturity: $('#bMat').value, adoption: $('#bAdo').value,
        confidence: $('#bConf').value, autonomy: $('#bAuto').value,
        effort: { manMonth: mm, months: mo },
        value: Math.min(5, Math.max(1, va)), risk: Math.min(5, Math.max(1, ri)),
        deps, desc: $('#bDesc').value.trim(), pitfall: $('#bPit').value.trim() || undefined
      });
      const v = TT.validate();
      TT.rebuild();
      openDrawer(n.id);
      toast(v.errors.length ? `已应用，但数据校验有 ${v.errors.length} 条错误，请点顶栏角标查看` : '已应用到基准树，记得导出 nodes.js');
    };
    const bExport = $('#bExport');
    if (bExport) bExport.onclick = () => nodesExport();

    const save = $('#edSave');
    if (save) save.onclick = () => {
      setOverride(n.id, {
        status: $('#edStatus').value, autonomy: $('#edAuto').value,
        owner: $('#edOwner').value.trim(), start: $('#edStart').value.trim(),
        target: $('#edTarget').value.trim(), note: $('#edNote').value.trim()
      });
      TT.rebuild(); openDrawer(n.id); toast('已保存到内存中的单位档案，记得导出档案文件');
    };
  }

  function setOverride(id, patch) {
    const org = M().orgById(S.orgId);
    if (!org || org.readonly) return toast('世界金融科技基准为只读视图，请先切换到具体单位');
    org.overrides = org.overrides || {};
    const cur = org.overrides[id] || {};
    Object.entries(patch).forEach(([k, v]) => { if (v === '') delete cur[k]; else cur[k] = v; });
    org.overrides[id] = cur;
    org.updatedAt = new Date().toISOString().slice(0, 10);
  }

  /* 聚合节点（领域 / 能力）的抽屉 */
  function drawAggregate(ref, kind, unitId, era) {
    const m = M();
    const eraObj = m.tx.eras.find(e => e.id === era);
    const techs = m.descendants(unitId || ref.id, S.nodes, S.h);
    const allTechs = m.descendants(ref.id, S.nodes, S.h);
    const benchmark = S.orgId === 'benchmark';
    const prog = benchmark ? m.maturityOf(techs) : m.progressOf(techs);
    const arch = kind === 'domain' ? ref.arch : m.archOfCap(ref.id);

    $('#dwTitle').textContent = (unitId && m.milestoneOf(unitId, S.nodes, S.h)) || ref.name;
    $('#dwEn').textContent = `${ref.name} · ${kind === 'domain' ? 'L0 领域' : 'L1 能力'} · ${ref.id}` +
      (eraObj ? ` · 本时代 ${techs.length} 项 / 全时代共 ${allTechs.length} 项` : ` · 覆盖 ${techs.length} 项技术`);
    $('#dwTags').innerHTML = [
      eraObj ? `<span class="tag">${eraObj.roman} ${eraObj.name}</span>` : '',
      archChip(arch),
      ref.spanArch?.length ? `<span class="tag" style="border-color:var(--accent-2);color:var(--accent-2)">横跨 5A</span>` : ''
    ].filter(Boolean).join('');

    const sec = [];
    if (ref.note) sec.push(`<div class="dw-sec"><div class="callout">${esc(ref.note)}</div></div>`);

    sec.push(`<div class="dw-sec"><h3>${benchmark ? '平均成熟度' : '建设完成度'}</h3>
      <div style="font-size:30px;font-weight:600;line-height:1.2">${Math.round(prog.pct * 100)}%</div>
      <div class="pb-track" style="margin:7px 0 9px"><div class="pb-fill" style="width:${prog.pct * 100}%;background:${TT.render.colorOf({ kind, id: unitId || ref.id, base: ref.id, ref, techs }, S)}"></div></div>
      ${benchmark ? `<p style="color:var(--text-faint);font-size:12px">按行业整体成熟度加权，非某家机构现状</p>`
        : `<dl class="kv">${m.tx.status.map(s => prog.stat[s.id] ? `<dt>${s.name}</dt><dd>${prog.stat[s.id]} 项</dd>` : '').join('')}</dl>`}
      </div>`);

    /* 瓶颈提示：本域内被下游依赖最多但尚未建成的节点 */
    if (!benchmark) {
      const cnt = new Map();
      S.nodes.forEach(x => (x.deps || []).forEach(d => cnt.set(d, (cnt.get(d) || 0) + 1)));
      const blockers = techs.filter(t => t._status !== 'built')
        .sort((a, b) => (cnt.get(b.id) || 0) - (cnt.get(a.id) || 0)).slice(0, 4);
      if (blockers.length) sec.push(`<div class="dw-sec"><h3>关键瓶颈（下游依赖最多且未建成）</h3>
        <div class="chips">${blockers.map(b => `<span class="chip" data-go="${b.id}">${esc(b.name)} · ${cnt.get(b.id) || 0} 个下游</span>`).join('')}</div></div>`);
    }

    if (eraObj) {
      const spread = m.tx.eras.map(e => {
        const cnt = allTechs.filter(t => t.era === e.id).length;
        return cnt ? `<span class="chip static" style="${e.id === era ? 'border-color:var(--accent);color:var(--text)' : ''}">${e.roman} ${cnt} 项</span>` : '';
      }).filter(Boolean).join('');
      sec.push(`<div class="dw-sec"><h3>本${kind === 'domain' ? '领域' : '能力'}在各时代的分布</h3>
        <div class="chips">${spread}</div>
        <p style="color:var(--text-faint);font-size:12px;margin-top:6px">
          聚合视图按「主体 × 时代」切分，同一个${kind === 'domain' ? '领域' : '能力'}会在多个时代列各出现一格。</p></div>`);
    }

    if (kind === 'domain') {
      const caps = m.tx.capabilities.filter(c => c.domain === ref.id);
      sec.push(`<div class="dw-sec"><h3>包含能力 ${caps.length}</h3><div class="chips">${caps.map(c =>
        `<span class="chip" data-open="${c.id}">${esc(c.name)}</span>`).join('')}</div></div>`);
    }

    sec.push(`<div class="dw-sec"><h3>包含技术 ${techs.length}</h3><div class="chips">${techs.map(t =>
      `<span class="chip" data-go="${t.id}">${esc(t.name)}</span>`).join('')}</div></div>`);

    const awards = techs.flatMap(t => t._awards || []);
    if (awards.length) {
      const uniq = [...new Map(awards.map(a => [a.year + a.org + a.project, a])).values()];
      sec.push(`<div class="dw-sec"><h3>关联金融科技发展奖 ${uniq.length}</h3><div class="evidence">${uniq.map(a =>
        `<div class="ev-row"><div>🏆 ${a.year} ${esc(a.level)} · ${esc(a.org)}</div>
         <div style="color:var(--text-dim)">${esc(a.project)}</div></div>`).join('')}</div></div>`);
    }

    /* 由底层技术边聚合出本格的前置与后继，缺了这两栏会让人误以为它没有前置 */
    const inc = new Map(), outg = new Map();
    S.nodes.forEach(n => (n.deps || []).forEach(d => {
      const dn = S.byId.get(d); if (!dn) return;
      const A = m.carrierOf(dn, S.expanded), B = m.carrierOf(n, S.expanded);
      const self = unitId || ref.id;
      if (B === self && A !== self) (inc.get(A) || inc.set(A, []).get(A)).push(`${dn.name} → ${n.name}`);
      if (A === self && B !== self) (outg.get(B) || outg.set(B, []).get(B)).push(`${dn.name} → ${n.name}`);
    }));
    const unitName = uid => {
      const { base, era } = m.splitUnitId(uid);
      const e = m.tx.eras.find(x => x.id === era);
      if (S.byId.has(base)) return S.byId.get(base).name;
      const ms = m.milestoneOf(uid, S.nodes, S.h);
      const r = m.capById.get(base) || m.domById.get(base);
      return (ms || (r ? r.name : uid)) + (e ? ` · ${e.roman}` : '');
    };
    const listBox = (map, empty) => map.size
      ? `<div class="chips">${[...map].map(([uid, why]) =>
          `<span class="chip" data-go="${uid}" title="${esc(why.slice(0, 4).join('\n'))}">${esc(unitName(uid))} <b>${why.length}</b></span>`).join('')}</div>`
      : `<p style="color:var(--text-faint)">${empty}</p>`;

    sec.push(`<div class="dw-sec"><h3>前置 ${inc.size}</h3>${listBox(inc, '无前置，是本条线的起点')}
      <p style="color:var(--text-faint);font-size:11.5px;margin-top:6px">数字为底层技术依赖的条数，悬停可看具体是哪几条</p></div>`);
    sec.push(`<div class="dw-sec"><h3>后继 ${outg.size}</h3>${listBox(outg, '暂无后继，该方向不再被依赖')}</div>`);

    sec.push(`<div class="dw-sec"><button class="btn sm" id="dwExpand">在图上展开本${kind === 'domain' ? '领域' : '能力'}</button></div>`);

    $('#dwBody').innerHTML = sec.join('');
    $('#dwBody').querySelectorAll('[data-go]').forEach(c => c.onclick = () => {
      const id = c.dataset.go;
      const t = S.byId.get(M().splitUnitId(id).base);
      if (t) { S.expanded.add(t._domain); S.expanded.add(t.cap); TT.rebuild(); }
      S.selected = id; openDrawer(id); api.applyHighlight(); api.centerOn(id, true);
    });
    $('#dwBody').querySelectorAll('[data-open]').forEach(c => c.onclick = () => {
      S.expanded.add(ref.id); S.expanded.add(c.dataset.open);
      TT.rebuild(); api.centerOn(c.dataset.open, true); openDrawer(c.dataset.open);
    });
    $('#dwExpand').onclick = () => {
      S.expanded.add(ref.id); TT.rebuild(); api.centerOn(ref.id, true);
    };
  }

      'background:var(--panel);border:1px solid var(--accent);border-radius:9px;padding:9px 14px;' +

      <label style="font-size:12px;color:var(--text-faint)">年产能

  function roadmap() {
    const m = M();
    if (!S.planTargets.size) return toast('请先在图上点选至少一个目标技术');
    const isBuilt = n => S.orgId !== 'benchmark' && n._status === 'built';
    const need = m.planClosure([...S.planTargets], S.byId, isBuilt);
    const cap = Math.max(100, +$('#planCap').value || 1200);
    const startYear = new Date().getFullYear();
    const plan = m.schedule(need, S.byId, cap, startYear, isBuilt);

    const totalMM = [...need].reduce((s, id) => s + (S.byId.get(id).effort?.manMonth || 0), 0);
    const years = plan.map(p => p.year);
    const maxE = Math.max(...plan.map(p => p.effort), 1);

    const rows = plan.map((p, pi) => {
      const items = p.ids.map(id => {
        const n = S.byId.get(id);
        const color = TT.render.colorOf({ kind: 'tech', id, ref: n, techs: [n] }, S);
        const isTarget = S.planTargets.has(id);
        const w = Math.max(8, (n.effort?.manMonth || 0) / cap * 100);
        return `<div class="gantt-row">
          <div class="gantt-name" title="${esc(n.name)}">${isTarget ? '🎯 ' : ''}${esc(n.name)}
            <span style="color:var(--text-faint)">· ${m.archById.get(n._arch)?.code}</span></div>
          <div class="gantt-track"><div class="gantt-bar" style="left:0;width:${Math.min(100, w)}%;background:${color}">
            ${n.effort?.manMonth || 0} 人月</div></div></div>`;
      }).join('');
      return `<div class="phase-head"><div class="phase-title">第 ${pi + 1} 阶段 · ${p.year} 年</div>
        <div style="font-size:11.5px;color:var(--text-faint)">${p.ids.length} 项 · 合计 ${p.effort} 人月（产能 ${cap}）</div></div>${items}`;
    }).join('');

    const curve = plan.map(p => `<div style="flex:1;text-align:center">
        <div style="height:${(p.effort / maxE * 80).toFixed(0)}px;background:linear-gradient(to top,var(--accent),transparent);
          margin:0 5px;border-radius:3px 3px 0 0"></div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:4px">${p.year}</div>
        <div style="font-size:11px;color:var(--text-dim)">${p.effort}</div></div>`).join('');

    const targets = [...S.planTargets].map(id => esc(S.byId.get(id)?.name || id)).join('、');
    modal('规划路线图',
      `目标：${targets}　·　最小依赖闭包 ${need.size} 项　·　总投入约 ${totalMM} 人月　·　跨 ${plan.length} 年`,
      `<div style="display:flex;align-items:flex-end;height:120px;margin-bottom:18px;
          border-bottom:1px solid var(--border);padding-bottom:6px">${curve}</div>${rows}`,
      `<button class="btn" id="rmMd">导出 Markdown</button>
       <button class="btn" id="rmHi">在图上高亮路线</button>
       <button class="btn" data-close>关闭</button>`);

    $('#rmMd').onclick = () => {
      const lines = [`# 技术路线图`, ``,
        `- 生成时间：${new Date().toISOString().slice(0, 10)}`,
        `- 视角单位：${m.orgById(S.orgId)?.orgName}`,
        `- 规划目标：${[...S.planTargets].map(id => S.byId.get(id)?.name).join('、')}`,
        `- 最小依赖闭包：${need.size} 项技术`,
        `- 总投入估算：约 ${totalMM} 人月`,
        `- 年度产能约束：${cap} 人月`, ``];
      plan.forEach((p, i) => {
        lines.push(`## 第 ${i + 1} 阶段 · ${p.year} 年（${p.ids.length} 项 · ${p.effort} 人月）`, '');
        lines.push('| 技术 | 架构线 | 时代 | 投入(人月) | 周期(月) | 价值 | 风险 |');
        lines.push('|---|---|---|---|---|---|---|');
        p.ids.forEach(id => {
          const n = S.byId.get(id);
          lines.push(`| ${S.planTargets.has(id) ? '🎯 ' : ''}${n.name} | ${m.archById.get(n._arch)?.code} ${m.archById.get(n._arch)?.name} | ${n.era} | ${n.effort?.manMonth || ''} | ${n.effort?.months || ''} | ${n.value} | ${n.risk} |`);
        });
        lines.push('');
      });
      lines.push('---', '', '> 投入估算为行业基准参考值，需结合本单位实际人力与外包策略调整。');
      download('技术路线图.md', lines.join('\n'), 'text/markdown;charset=utf-8');
    };
    $('#rmHi').onclick = () => {
      closeModal();
      const svg = $('#canvas');
      svg.querySelectorAll('.node').forEach(g => {
        const ids = g.dataset.kind === 'tech' ? [g.dataset.id]
          : m.descendants(g.dataset.id, S.nodes, S.h).map(t => t.id);
        g.classList.toggle('faded', !ids.some(i => need.has(i)));
      });
      svg.querySelectorAll('.edge').forEach(e => e.classList.add('faded'));
      toast(`已高亮 ${need.size} 项路线节点，点击空白处恢复`);
    };
  }

  /* ---------------- 奖项热力图 ---------------- */
  function awardHeatmap() {
    const m = M();
    const years = [...new Set((TT.awards || []).map(a => a.year))].sort();
    const doms = m.tx.domains;
    const grid = new Map();
    (TT.awards || []).forEach(a => (a.mappedNodes || []).forEach(id => {
      const n = TT.nodes.find(x => x.id === id); if (!n) return;
      const d = m.domainOfCap(n.cap);
      const k = a.year + '|' + d;
      grid.set(k, (grid.get(k) || 0) + 1);
    }));
    const max = Math.max(1, ...grid.values());

    const head = `<div class="heat-grid" style="grid-template-columns:180px repeat(${years.length},1fr)">
      <div></div>${years.map(y => `<div class="heat-head">${y}</div>`).join('')}
      ${doms.map(d => `<div class="heat-label">${m.archById.get(d.arch)?.code} ${d.name}</div>` +
        years.map(y => {
          const v = grid.get(y + '|' + d.id) || 0;
          const a = v / max;
          return `<div class="heat-cell" style="background:rgba(245,196,81,${(a * .82 + (v ? .1 : .02)).toFixed(2)})"
            title="${d.name} · ${y} 年 · ${v} 个关联获奖项目">${v || ''}</div>`;
        }).join('')).join('')}
    </div>`;

    const stats = (TT.awardStats || []).map(s => `<tr>
      <td>${s.year}</td><td class="num">${s.total ?? '—'}</td>
      <td>${s.levels ? Object.entries(s.levels).map(([k, v]) => `${k} ${v}`).join(' · ') : '—'}</td>
      <td style="font-size:11.5px;color:var(--text-faint)">${esc(s.note || '')}</td></tr>`).join('');

    modal('金融科技发展奖 · 领域热力图',
      '中国人民银行金融科技发展奖是金融业唯一部级科技类奖项，可作为行业成熟度的客观佐证',
      `${head}
       <p style="margin:18px 0 8px;color:var(--text-faint);font-size:12px">
         格子数字为该领域在当年关联到的获奖项目数（基于本工具已录入的条目，非官方完整统计）。</p>
       <h3 style="font-size:12px;color:var(--text-faint);letter-spacing:1.4px;margin:18px 0 7px">历年评奖总体情况</h3>
       <table class="grid"><thead><tr><th>年度</th><th class="num">获奖总数</th><th>等级分布</th><th>说明</th></tr></thead>
       <tbody>${stats}</tbody></table>
       <div class="callout" style="margin-top:16px">
         获奖代表该机构在此方向具备一定成熟度；<b>未获奖不代表该机构没有建设</b>。
         本工具只把奖项当作加分证据，不做反向推断。<br>
         当前已录入 ${(TT.awards || []).length} 条项目条目，多数标注为「待与官方 PDF 复核」，
         完整名单请从人民银行官网公示补全（见 docs/奖项数据导入指南.md）。
       </div>`,
      `<button class="btn" id="awCsv">导出奖项 CSV 模板</button><button class="btn" data-close>关闭</button>`);

    $('#awCsv').onclick = () => {
      const rows = [['year', 'level', 'org', 'project', 'mappedNodes', 'source', 'url', 'verified']];
      (TT.awards || []).forEach(a => rows.push([a.year, a.level, a.org, a.project,
        (a.mappedNodes || []).join('|'), a.source || '', a.url || '', a.verified || '']));
      download('金融科技发展奖_导入模板.csv', '﻿' + rows.map(r =>
        r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv;charset=utf-8');
    };
  }

  function exportMenu(anchor) {
    const r = anchor.getBoundingClientRect();
    const old = $('#expMenu'); if (old) { old.remove(); return; }
    const menu = document.createElement('div');
    menu.id = 'expMenu';
    menu.style.cssText = `position:fixed;top:${r.bottom + 6}px;left:${Math.max(8, r.left - 90)}px;z-index:70;
      background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:8px;
      padding:5px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:210px`;

      ['当前视图 PNG 图片', pngExport],
      ['本单位档案 JSON', orgExport],
      ['节点清单 CSV（Excel 可开）', csvExport],
      ['节点数据文件 nodes.js', nodesExport],
      ['科技树全量说明 Markdown', mdExport]
    ];
    items.forEach(([label, fn]) => {
      const b = document.createElement('button');

  function pngExport() {
    const svg = $('#canvas').cloneNode(true);
    const L = S.L;
    svg.setAttribute('viewBox', `0 0 ${L.width} ${L.height}`);
    svg.setAttribute('width', L.width); svg.setAttribute('height', L.height);
    svg.querySelector('.viewport')?.setAttribute('transform', '');
    const css = document.querySelector('link[href*="styles.css"]');
    /* 把当前主题的计算色写死进去，保证导出图不依赖外部 CSS */
    const cs = getComputedStyle(document.documentElement);
    const vars = ['--text', '--text-dim', '--text-faint', '--accent', '--accent-2', '--gold',
      '--edge', '--edge-locked', '--grid', '--bg-0', '--lane-a5'];
    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = `
      text{font-family:${cs.fontFamily || 'sans-serif'}}
      .lane-label{fill:${cs.getPropertyValue('--text-faint')};font-size:12px;font-weight:600;letter-spacing:2px;text-anchor:middle}
      .lane-label .code{fill:${cs.getPropertyValue('--accent')}}
      .lane-line,.era-line{stroke:${cs.getPropertyValue('--grid')};stroke-width:1}
      .lane-bg{fill:transparent}.lane-bg.band{fill:${cs.getPropertyValue('--lane-a5')}}
      .era-band{fill:${cs.getPropertyValue('--era-band')}}
      .era-title{fill:${cs.getPropertyValue('--text-faint')};font-size:12px;font-weight:600;text-anchor:middle}
      .era-roman{fill:${cs.getPropertyValue('--accent')};font-size:17px;font-weight:700;text-anchor:middle;opacity:.55}
      .era-period{fill:${cs.getPropertyValue('--text-faint')};font-size:10px;text-anchor:middle;opacity:.7}
      .edge{fill:none;stroke:${cs.getPropertyValue('--edge')};stroke-linecap:round}
      .edge.locked{stroke:${cs.getPropertyValue('--edge-locked')};stroke-dasharray:4 5}
      .edge.gate{stroke:rgba(230,90,90,.5);stroke-dasharray:6 4}
      .node .title{fill:${cs.getPropertyValue('--text')};font-size:12.5px;font-weight:500}
      .node .meta{fill:${cs.getPropertyValue('--text-faint')};font-size:10px}
      .node .cnt{fill:${cs.getPropertyValue('--text-dim')};font-size:10.5px}
      .node.locked .shape{opacity:.42}.node.locked .title{fill:${cs.getPropertyValue('--text-faint')}}
      .node .shape{stroke-width:1.4}
      .ring-bg{fill:none;stroke:${cs.getPropertyValue('--ring-bg')};stroke-width:3}
      .ring-fg{fill:none;stroke-width:3;stroke-linecap:round}
      .spanband{fill:${cs.getPropertyValue('--accent-2')};opacity:.05}
      .building-ring{fill:none;stroke:#fbbf24;stroke-width:1.6;stroke-dasharray:7 4}
      .pulse{opacity:.7}`;
    svg.insertBefore(style, svg.firstChild);
    const bgr = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgr.setAttribute('width', L.width); bgr.setAttribute('height', L.height);
    bgr.setAttribute('fill', cs.getPropertyValue('--bg-0').trim() || '#05070f');
    svg.insertBefore(bgr, style.nextSibling);

    const data = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    const scale = Math.min(2, 4000 / L.width);
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = L.width * scale; c.height = L.height * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = cs.getPropertyValue('--bg-0').trim() || '#05070f';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => download('金融科技树.png', b), 'image/png');
    };
    img.onerror = () => toast('图片导出失败，可改用系统截图');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
    toast('正在生成 PNG…');
  }

      updatedAt: new Date().toISOString().slice(0, 10),

      overrides: org.overrides || {}, customNodes: org.customNodes || []
    }, null, 2);

 * 用法：覆盖 data/orgs/${org.orgId}.js 即可生效。 */
var TT = (globalThis.TT = globalThis.TT || {});
TT.orgs = TT.orgs || [];
TT.orgs.push(${body});
`;

  function csvExport() {
    const m = M();
    const head = ['id', 'name', 'en', 'domain', 'capability', 'arch', 'era', 'deps',
      'maturity', 'adoption', 'confidence', 'autonomy', 'tags',

        n.effort?.manMonth ?? '', n.effort?.months ?? '', n.value, n.risk,
        S.orgId === 'benchmark' ? '' : (n._status || ''), n.owner || '', n.target || '',
        (n.note || '').replace(/\n/g, ' '), n.desc]);
