/* ==== assets/styles.css ==== */
/* ==========================================================================
 * 金融科技树 · 样式与主题
 * 主题 A themeA-space  深空科技风（默认）
 * 主题 B themeB-bank   银行专业风
 * ========================================================================== */

/* ---------- 主题 A：深空科技风 ---------- */
:root,
[data-theme="A"] {
  --bg-0: #05070f;
  --bg-1: #080c18;
  --bg-2: #0d1424;
  --panel: rgba(13, 20, 36, .92);
  --panel-solid: #0d1424;
  --border: rgba(120, 160, 220, .16);
  --border-strong: rgba(120, 160, 220, .34);
  --text: #e6edf8;
  --text-dim: #93a4c0;
  --text-faint: #5d6d8a;
  --accent: #45c8ff;
  --accent-2: #a78bfa;
  --gold: #f5c451;
  --edge: rgba(120, 160, 220, .30);
  --edge-locked: rgba(90, 108, 138, .16);
  --edge-up: #ffb84d;
  --edge-down: #45e0d0;
  --grid: rgba(120, 160, 220, .045);
  --glow: 1;
  --stars: 1;
  --lane-a5: rgba(255, 90, 90, .05);
  --track: rgba(255, 255, 255, .07);
  --ring-bg: rgba(255, 255, 255, .11);
  --era-band: rgba(120, 160, 220, .022);
  --mask: rgba(0, 0, 0, .62);
  --node-fill: 22;
  --shadow: 0 18px 44px rgba(0, 0, 0, .6);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

/* ---------- 主题 B：银行专业风（亮色） ---------- */
[data-theme="B"] {
  --bg-0: #f2f5fa;
  --bg-1: #ffffff;
  --bg-2: #e9eef6;
  --panel: rgba(255, 255, 255, .97);
  --panel-solid: #ffffff;
  --border: rgba(28, 55, 92, .15);
  --border-strong: rgba(28, 55, 92, .32);
  --text: #17202e;
  --text-dim: #46566d;
  --text-faint: #7a8ba1;
  --accent: #1a6dbd;
  --accent-2: #6b46c1;
  --gold: #a8730a;
  --edge: rgba(52, 82, 122, .34);
  --edge-locked: rgba(120, 138, 162, .30);
  --edge-up: #b8770c;
  --edge-down: #0d7f77;
  --grid: rgba(28, 55, 92, .09);
  --glow: 0;
  --stars: 0;
  --lane-a5: rgba(200, 60, 60, .05);
  --track: rgba(23, 32, 46, .10);
  --ring-bg: rgba(23, 32, 46, .13);
  --era-band: rgba(28, 55, 92, .030);
  --mask: rgba(36, 52, 74, .40);
  --shadow: 0 10px 28px rgba(20, 40, 70, .16);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================ 布局骨架 ============================ */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------------- 顶栏 ---------------- */
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; background: var(--bg-1);
  border-bottom: 1px solid var(--border); z-index: 30; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 9px; margin-right: 4px; }
.brand h1 { font-size: 16px; margin: 0; letter-spacing: .5px; font-weight: 600; }
.brand .sub { font-size: 11px; color: var(--text-faint); }
.tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; }
.tb-group { display: flex; align-items: center; gap: 5px; }
.tb-label { font-size: 11px; color: var(--text-faint); margin-right: 2px; white-space: nowrap; }

.btn {
  background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text-dim); padding: 5px 11px; border-radius: 6px;
  cursor: pointer; white-space: nowrap; font-size: 12.5px;
  transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { background: var(--bg-0); color: var(--text); border-color: var(--border-strong); }
.btn.on {
  background: color-mix(in srgb, var(--accent) 20%, transparent);
  border-color: var(--accent); color: var(--text);
}
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn.warn { border-color: #d97070; color: #ffb0b0; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg .btn { border: none; border-radius: 0; border-right: 1px solid var(--border); }
.seg .btn:last-child { border-right: none; }

select.btn, input.btn { padding: 5px 8px; }
input.search { width: 150px; }

.badge-err, .badge-warn {
  padding: 3px 9px; border-radius: 20px; font-size: 11.5px; cursor: pointer; border: 1px solid;
}
.badge-err  { background: rgba(220, 70, 70, .16); border-color: #d94646; color: #ffb3b3; }
.badge-warn { background: rgba(230, 175, 60, .13); border-color: #b98c2e; color: #f0cd7d; }

/* ---------------- 进度条 ---------------- */
#progressbar {
  display: flex; gap: 0; background: var(--bg-1);
  border-bottom: 1px solid var(--border); padding: 0; z-index: 25;
}
.pb-cell {
  flex: 1; padding: 6px 12px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0;
}
.pb-cell:last-child { border-right: none; }
.pb-cell:hover { background: var(--bg-2); }
.pb-cell.dim { opacity: .38; }
.pb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.pb-name { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-pct { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.pb-track { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
.pb-fill { height: 100%; border-radius: 2px; transition: width .5s cubic-bezier(.22,.9,.3,1); }

/* ---------------- 画布 ---------------- */
#stage { flex: 1; position: relative; overflow: hidden; background: var(--bg-0); }
#stars { position: absolute; inset: 0; pointer-events: none; opacity: var(--stars); }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; display: block; }
#canvas.dragging { cursor: grabbing; }

#breadcrumb {
  position: absolute; top: 10px; left: 14px; z-index: 12;
  display: flex; align-items: center; gap: 6px; font-size: 12px;
  background: var(--panel); border: 1px solid var(--border);
  padding: 5px 11px; border-radius: 7px; backdrop-filter: blur(8px);
}
#breadcrumb .crumb { cursor: pointer; color: var(--text-dim); }
#breadcrumb .crumb:hover { color: var(--accent); }
#breadcrumb .crumb.cur { color: var(--text); cursor: default; }
#breadcrumb .sep { color: var(--text-faint); }

#zoomctl {
  position: absolute; right: 14px; bottom: 14px; z-index: 12;
  display: flex; flex-direction: column; gap: 5px;
}
#zoomctl .btn { width: 32px; height: 30px; padding: 0; text-align: center; }

#legend {
  position: absolute; left: 14px; bottom: 14px; z-index: 12; cursor: default;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font-size: 11.5px;
  backdrop-filter: blur(8px); max-width: 300px;
}
#legend .lg-title { color: var(--text-faint); margin-bottom: 6px; font-size: 11px; }
#legend .lg-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; color: var(--text-dim); }
#legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
#legend .lg-note { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--border);
  color: var(--text-faint); font-size: 10.5px; line-height: 1.5; }

#hint {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 12;
  background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
  padding: 5px 15px; font-size: 11.5px; color: var(--text-faint);
  backdrop-filter: blur(8px); pointer-events: none; transition: opacity .4s;
}

/* ---------------- SVG 元素 ---------------- */
.lane-bg { fill: transparent; }
.lane-bg.band { fill: var(--lane-a5); }
.lane-label {
  fill: var(--text-faint); font-size: 12px; font-weight: 600;
  letter-spacing: 2px; text-anchor: middle;
}
.lane-label .code { fill: var(--accent); }
.lane-line { stroke: var(--grid); stroke-width: 1; }
.era-band { fill: var(--era-band); }
.era-line { stroke: var(--grid); stroke-width: 1; }
.era-title { fill: var(--text-faint); font-size: 12px; font-weight: 600; text-anchor: middle; }
.era-roman { fill: var(--accent); font-size: 17px; font-weight: 700; text-anchor: middle; opacity: .55; }
.era-period { fill: var(--text-faint); font-size: 10px; text-anchor: middle; opacity: .7; }

.edge { fill: none; stroke: var(--edge); stroke-linecap: round; transition: opacity .18s, stroke .18s; }
.edge.locked { stroke: var(--edge-locked); stroke-dasharray: 4 5; }
.edge.gate { stroke: rgba(230, 90, 90, .5); stroke-dasharray: 6 4; }
.edge.up { stroke: var(--edge-up); stroke-width: 2.2; opacity: 1 !important; }
.edge.down { stroke: var(--edge-down); stroke-width: 2.2; opacity: 1 !important; }
.edge.route { stroke: var(--gold); stroke-width: 2.6; opacity: 1 !important; }
.edge.faded { opacity: .06; }

.flow { fill: var(--accent); opacity: .85; }
[data-theme="B"] .flow { display: none; }

.node { cursor: pointer; }
.node .shape {
  stroke-width: 1.4; transition: opacity .18s, filter .18s, stroke .18s;
}
.node .title { fill: var(--text); font-size: 12.5px; font-weight: 500; pointer-events: none; }
.node .meta  { fill: var(--text-faint); font-size: 10px; pointer-events: none; }
.node .cnt   { fill: var(--text-dim); font-size: 10.5px; pointer-events: none; }
.node.locked .title { fill: var(--text-faint); }
.node.locked .shape { opacity: .42; }
.node.faded { opacity: .12; }
.node.hi .shape { filter: drop-shadow(0 0 9px currentColor); }
.node.sel .shape { stroke-width: 2.6; }
.node .ring-bg { fill: none; stroke: var(--ring-bg); stroke-width: 3; }
.node .ring-fg { fill: none; stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); }
.node .award { font-size: 11px; pointer-events: none; }
.node .frontier { fill: none; stroke: var(--accent-2); stroke-width: 1; opacity: .5; }
.node .spanband { fill: var(--accent-2); opacity: .05; }
.node .badge-txt { font-size: 9.5px; pointer-events: none; }

@keyframes dashmove { to { stroke-dashoffset: -22; } }
.node .building-ring {
  fill: none; stroke: #fbbf24; stroke-width: 1.6;
  stroke-dasharray: 7 4; animation: dashmove 1.4s linear infinite;
}
[data-theme="B"] .building-ring { animation: none; }

/* ---------------- 右侧抽屉 ---------------- */
#drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: 410px; max-width: 92vw;
  background: var(--panel); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.22,.9,.3,1);
  z-index: 20; display: flex; flex-direction: column; backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
}
#drawer.open { transform: none; }
.dw-head { padding: 14px 16px 11px; border-bottom: 1px solid var(--border); }
.dw-head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.dw-head h2 { margin: 0 0 3px; font-size: 16px; font-weight: 600; line-height: 1.35; }
.dw-head .en { font-size: 11.5px; color: var(--text-faint); }
.dw-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.tag {
  font-size: 10.5px; padding: 2px 8px; border-radius: 11px;
  border: 1px solid var(--border-strong); color: var(--text-dim);
}
.dw-body { flex: 1; overflow-y: auto; padding: 13px 16px 26px; }
.dw-sec { margin-bottom: 16px; }
.dw-sec > h3 {
  font-size: 11px; color: var(--text-faint); margin: 0 0 7px;
  letter-spacing: 1.4px; font-weight: 600;
}
.dw-sec p { margin: 0 0 6px; line-height: 1.65; color: var(--text-dim); font-size: 13px; }
.kv { display: grid; grid-template-columns: 82px 1fr; gap: 5px 10px; font-size: 12.5px; }
.kv dt { color: var(--text-faint); }
.kv dd { margin: 0; color: var(--text-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-size: 11.5px; padding: 3px 9px; border-radius: 5px;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.static { cursor: default; }
.chip.static:hover { border-color: var(--border); color: var(--text-dim); }
ul.tight { margin: 0; padding-left: 17px; }
ul.tight li { margin: 3px 0; line-height: 1.6; color: var(--text-dim); font-size: 12.5px; }
.callout {
  border-left: 2px solid var(--gold); padding: 8px 11px; font-size: 12.5px;
  background: rgba(245, 196, 81, .06); color: #f0d493; line-height: 1.6; border-radius: 0 5px 5px 0;
}
.callout.gate { border-color: #e05a5a; background: rgba(224, 90, 90, .07); color: #f5b0b0; }
.evidence { border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; font-size: 12px; }
.evidence .ev-row { padding: 5px 0; border-bottom: 1px dashed var(--border); }
.evidence .ev-row:last-child { border-bottom: none; }
.evidence .ev-meta { color: var(--text-faint); font-size: 11px; margin-top: 2px; }
.evidence a { color: var(--accent); text-decoration: none; }
.evidence a:hover { text-decoration: underline; }
.unverified { color: var(--text-faint); font-style: italic; }
.status-picker { display: flex; flex-wrap: wrap; gap: 5px; }
.editrow { display: grid; grid-template-columns: 76px 1fr; gap: 6px 9px; align-items: center; margin-bottom: 7px; }
.editrow label { font-size: 11.5px; color: var(--text-faint); }
.editrow input, .editrow select, .editrow textarea {
  background: var(--bg-0); border: 1px solid var(--border); color: var(--text);
  border-radius: 5px; padding: 5px 8px; width: 100%; font-size: 12.5px;
}
.editrow textarea { resize: vertical; min-height: 52px; line-height: 1.5; }

/* ---------------- 通用弹窗 ---------------- */
.modal-mask {
  position: fixed; inset: 0; background: var(--mask);
  z-index: 60; display: flex; align-items: center; justify-content: center; padding: 26px;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--panel-solid); border: 1px solid var(--border-strong);
  border-radius: 11px; max-width: 1080px; width: 100%; max-height: 88vh;
  display: flex; flex-direction: column; box-shadow: var(--shadow);
}
.modal-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.modal-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.modal-head .sub { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
.modal-body { padding: 16px 18px 22px; overflow: auto; }
.modal-foot {
  padding: 11px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid th, table.grid td {
  padding: 6px 9px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top;
}
table.grid th { color: var(--text-faint); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
table.grid td { color: var(--text-dim); }
table.grid tr:hover td { background: var(--bg-2); }
.num { font-variant-numeric: tabular-nums; text-align: right; }

/* 路线图甘特 */
.gantt-row { display: grid; grid-template-columns: 250px 1fr; gap: 10px; align-items: center; margin: 3px 0; }
.gantt-name { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-track { position: relative; height: 21px; background: var(--track); border-radius: 4px; }
.gantt-bar {
  position: absolute; top: 2px; bottom: 2px; border-radius: 4px;
  display: flex; align-items: center; padding: 0 7px; font-size: 10.5px;
  color: #06121f; font-weight: 600; overflow: hidden; white-space: nowrap;
}
.phase-head { display: grid; grid-template-columns: 250px 1fr; gap: 10px; margin: 14px 0 5px; }
.phase-title { font-size: 12.5px; color: var(--accent); font-weight: 600; }
.year-axis { display: flex; }
.year-cell { flex: 1; text-align: center; font-size: 11px; color: var(--text-faint); border-left: 1px solid var(--border); }

/* 热力图 */
.heat-grid { display: grid; gap: 2px; }
.heat-cell {
  height: 30px; border-radius: 3px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text); cursor: default; font-variant-numeric: tabular-nums;
}
.heat-label { font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; padding-right: 8px; }
.heat-head { font-size: 11.5px; color: var(--text-faint); text-align: center; padding-bottom: 4px; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--panel-solid); border: 1px solid var(--accent);
  padding: 9px 17px; border-radius: 8px; z-index: 90; font-size: 13px;
  box-shadow: var(--shadow); animation: fadein .2s;
}
@keyframes fadein { from { opacity: 0; transform: translate(-50%, 8px); } }

/* 全屏演示 */
body.presenting #topbar, body.presenting #progressbar,
body.presenting #legend, body.presenting #zoomctl { display: none; }
#presenter {
  position: absolute; inset: auto 0 0 0; z-index: 40; padding: 22px 34px 26px;
  background: linear-gradient(to top, var(--bg-0) 55%, transparent);
  display: none;
}
body.presenting #presenter { display: block; }
#presenter h2 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
#presenter h2 .roman { color: var(--accent); margin-right: 11px; }
#presenter .p-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 9px; }
#presenter .p-body { color: var(--text-dim); font-size: 13.5px; line-height: 1.75; max-width: 940px; }
#presenter .p-ctl { position: absolute; right: 34px; bottom: 26px; display: flex; gap: 8px; }
#presenter .p-dots { display: flex; gap: 6px; margin-bottom: 12px; }
#presenter .p-dot { width: 26px; height: 3px; border-radius: 2px; background: var(--border-strong); }
#presenter .p-dot.on { background: var(--accent); }

/* 跨 5A 宽卡片的贯穿高亮带（如「人工智能与大模型」领域） */
.node .spanband, .spans .spanband { fill: var(--accent-2); opacity: .055; }
.spans .spanband-edge {
  fill: none; stroke: var(--accent-2); stroke-width: 1;
  stroke-dasharray: 3 6; opacity: .34;
}
.spans .spanband-tip {
  fill: var(--accent-2); font-size: 10px; opacity: .6; letter-spacing: 1px;
}


/* ---------- 亮色主题下的局部修正 ---------- */
[data-theme="B"] .gantt-bar { color: #fff; }
[data-theme="B"] #stars { display: none; }
[data-theme="B"] .heat-cell { color: #2a2416; }
[data-theme="B"] .callout { background: rgba(168, 115, 10, .09); color: #6d4c07; }
[data-theme="B"] .callout.gate { background: rgba(200, 60, 60, .08); color: #8f2b2b; }
[data-theme="B"] .badge-warn { background: rgba(168, 115, 10, .12); border-color: #b8860b; color: #7a5606; }
[data-theme="B"] .badge-err { background: rgba(200, 50, 50, .10); border-color: #c23b3b; color: #9b2222; }
[data-theme="B"] .node.locked .shape { opacity: .55; }
[data-theme="B"] .edge.gate { stroke: rgba(190, 55, 55, .55); }
[data-theme="B"] #presenter {
  background: linear-gradient(to top, var(--bg-0) 55%, rgba(242, 245, 250, 0));
}
[data-theme="B"] .btn.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* ---------- 冻结表头（时代 / 架构线） ---------- */
#eraBar {
  position: absolute; top: 0; left: 0; right: 0; height: 58px;
  pointer-events: none; z-index: 9; overflow: hidden;
  background: linear-gradient(to bottom, var(--bg-0) 55%, transparent);
}
#laneBar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 58px;
  pointer-events: none; z-index: 9; overflow: hidden;
  background: linear-gradient(to right, var(--bg-0) 55%, transparent);
}
.era-chip {
  position: absolute; top: 6px; transform: translateX(-50%);
  text-align: center; white-space: nowrap; line-height: 1.25;
}
.era-chip .rm { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.era-chip .nm { font-size: 12px; color: var(--text-dim); font-weight: 600; }
.era-chip .pd { font-size: 10px; color: var(--text-faint); }
.era-chip .ul { height: 3px; border-radius: 2px; margin: 4px auto 0; width: 46px; }
.lane-chip {
  position: absolute; left: 50%; transform-origin: center center;
  transform: translate(-50%, -50%) rotate(-90deg);
  font-size: 12.5px; font-weight: 600; letter-spacing: 1.5px;
  white-space: nowrap; color: var(--text-dim);
}
.lane-chip .cd { font-weight: 700; }
.lane-chip.dim { opacity: .3; }

/* 亮色主题下淡化不能太狠，否则节点直接和白底融成一片、看着像「全变白了」 */
[data-theme="B"] .node.faded { opacity: .28; }
[data-theme="B"] .edge.faded { opacity: .14; }
[data-theme="B"] .pb-cell.dim { opacity: .45; }

/* 聚合格的副标题：领域名 · N 项。它是归属标记，作用等同于文明节点上的类别图标，
   所以刻意做小、做淡，视觉主角是上面那行里程碑名。 */
.node .owner { fill: var(--text-dim); font-size: 10px; font-weight: 500; pointer-events: none; }
/* 退役 / 存量维持的节点 */
.node.lc-sunset .shape { stroke-dasharray: 5 3; }

/* 冻结列里的架构块：承载原顶部 A1–A5 进度条的信息与筛选功能 */
#laneBar { width: 74px; }
.lane-chip { pointer-events: auto; cursor: pointer; }
.lane-chip .lc-txt { white-space: nowrap; }
.lane-chip .lc-bar {
  height: 3px; border-radius: 2px; background: var(--track);
  margin-top: 5px; overflow: hidden;
}
.lane-chip .lc-bar i { display: block; height: 100%; border-radius: 2px; }
.lane-chip:hover { color: var(--text); }
.lane-chip.on .lc-txt { text-shadow: 0 0 10px currentColor; }
.lane-chip.on .lc-bar { box-shadow: 0 0 0 1px var(--border-strong); }
.era-chip { pointer-events: auto; cursor: pointer; }
.era-chip.dim { opacity: .35; }
.era-chip.on .nm { color: var(--text); }
.era-chip:hover .nm { color: var(--text); }

/* 聚合格右上角的 ⓘ：单击卡片下钻，单击 ⓘ 看详情，避免和双击抢操作 */
.node .info-dot {
  fill: var(--panel-solid); stroke: currentColor; stroke-width: 1;
  opacity: .5; transition: opacity .15s;
}
.node .info-i {
  font-size: 10px; font-weight: 700; font-style: italic;
  fill: currentColor; opacity: .8; pointer-events: none;
}
.node:hover .info-dot { opacity: 1; }
.node .info-dot:hover { fill: currentColor; }
.lane-chip { overflow: hidden; text-overflow: ellipsis; }

/* 双向依赖：两个聚合格在同一时代互为前置。这是真实的业务事实，
   显式画出来而不是藏起来；下钻到技术层它会自然消失（技术层是严格 DAG）。 */
.edge.bidir {
  stroke: var(--accent-2); stroke-width: 2; fill: none;
  stroke-dasharray: none; opacity: .85;
}
.edge.bidir:hover { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-2)); }

/* 双向依赖：两个聚合格在同一时代互为前置。这是真实的业务事实，
   显式画出来而不是藏起来；下钻到技术层它会自然消失（技术层是严格 DAG）。 */
.edge.bidir {
  stroke: var(--accent-2); stroke-width: 2; fill: none;
  stroke-dasharray: none; opacity: .85;
}
.edge.bidir:hover { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-2)); }

/* 多点环路里被迫回折的那一条 */
.edge.cyc { stroke: #f0a05a; stroke-width: 1.8; fill: none; opacity: .8; stroke-dasharray: 7 4; }
.edge.cyc:hover { opacity: 1; }

/* 单时代筛选时，相邻时代的标签保持半透明可点，作为「下一步去哪」的提示 */
.era-chip.adjacent { opacity: .5; }
.era-chip.adjacent:hover { opacity: 1; }
.era-chip.adjacent.prev .nm::before { content: '‹ '; opacity: .7; }
.era-chip.adjacent.next .nm::after  { content: ' ›'; opacity: .7; }
.era-chip.on .rm { text-shadow: 0 0 12px currentColor; }
.era-chip.dim { opacity: .22; }

</style>
